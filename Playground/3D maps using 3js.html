<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛰️ Satellite Image Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Control Panel */
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 90%;
        }
        .controls button {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #dce5ff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }
        .controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .controls button.primary {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }
        .controls button.primary:hover {
            background: #7d6ff0;
        }
        .controls button.success {
            background: #00b894;
            border-color: #00b894;
            color: white;
        }
        .controls button.success:hover {
            background: #00d2a0;
        }
        .controls button.danger {
            background: #e17055;
            border-color: #e17055;
            color: white;
        }
        .controls button.danger:hover {
            background: #e74c6f;
        }
        .controls .search-box {
            display: flex;
            gap: 0.4rem;
        }
        .controls .search-box input {
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #dce5ff;
            font-size: 0.85rem;
            outline: none;
            width: 180px;
            transition: 0.15s;
        }
        .controls .search-box input:focus {
            border-color: #6c5ce7;
            background: rgba(255, 255, 255, 0.05);
        }
        .controls .search-box input::placeholder {
            color: #54668f;
        }

        .info-badge {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
            color: #8899c7;
            z-index: 1000;
            pointer-events: none;
        }
        .info-badge span {
            color: #dce5ff;
            font-weight: 600;
        }

        .coords-display {
            position: absolute;
            bottom: 6rem;
            left: 1.5rem;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.4rem 0.8rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.7rem;
            color: #54668f;
            z-index: 1000;
            pointer-events: none;
            font-family: monospace;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-overlay h2 {
            margin-top: 1rem;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .loading-overlay p {
            color: #8899c7;
            margin-top: 0.3rem;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 8rem;
            right: 2rem;
            padding: 0.8rem 1.5rem;
            border-radius: 1rem;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #dce5ff;
            font-size: 0.9rem;
            z-index: 99999;
            display: none;
            animation: slideUp 0.3s ease;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .toast.show {
            display: block;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .controls {
                bottom: 1rem;
                padding: 0.8rem 1rem;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
            .controls .search-box input {
                width: 120px;
                font-size: 0.75rem;
            }
            .controls button {
                padding: 0.3rem 0.8rem;
                font-size: 0.75rem;
            }
            .info-badge {
                top: 0.5rem;
                right: 0.8rem;
                font-size: 0.6rem;
                padding: 0.3rem 0.6rem;
            }
            .coords-display {
                bottom: 5rem;
                left: 0.8rem;
                font-size: 0.6rem;
                padding: 0.2rem 0.6rem;
            }
        }
        @media (max-width: 480px) {
            .controls .search-box input {
                width: 80px;
            }
            .controls {
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <h2>🛰️ Loading Satellite Map</h2>
        <p>Fetching terrain data from OpenStreetMap...</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Info Badge -->
    <div class="info-badge">
        🛰️ <span>Satellite View</span> • OpenStreetMap
    </div>

    <!-- Coordinates -->
    <div class="coords-display" id="coordsDisplay">🌍 0.0000, 0.0000</div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search location..." />
            <button id="searchBtn">🔍</button>
        </div>
        <button id="resetViewBtn">🔄 Reset View</button>
        <button id="toggle3DBtn" class="primary">🌍 3D Mode</button>
        <button id="satelliteBtn" class="success">🛰️ Satellite</button>
        <button id="terrainBtn">⛰️ Terrain</button>
        <button id="streetBtn">🗺️ Street</button>
    </div>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Three.js for 3D terrain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ---------- Map Initialization ----------
            const map = L.map('map', {
                center: [20, 0],
                zoom: 3,
                zoomControl: true,
                fadeAnimation: true,
                zoomAnimation: true,
                attributionControl: true
            });

            // ---------- Tile Layers ----------
            const tileLayers = {
                // Satellite/Imagery
                satellite: L.tileLayer(
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>',
                        maxZoom: 19,
                        subdomains: ['a', 'b', 'c']
                    }),

                // Satellite with labels
                satelliteLabels: L.tileLayer(
                    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>',
                        maxZoom: 19,
                        subdomains: ['a', 'b', 'c']
                    }),

                // Terrain
                terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://opentopomap.org/">OpenTopoMap</a>',
                    maxZoom: 17,
                    subdomains: 'abcd'
                }),

                // Street/Standard
                street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                    maxZoom: 19,
                    subdomains: 'abc'
                }),

                // Dark
                dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                    maxZoom: 19,
                    subdomains: 'abcd'
                }),

                // Google Satellite (using proxies)
                googleSatellite: L.tileLayer(
                    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                        attribution: '&copy; <a href="https://maps.google.com/">Google</a>',
                        maxZoom: 20,
                        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                    }),

                // Google Hybrid
                googleHybrid: L.tileLayer(
                    'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                        attribution: '&copy; <a href="https://maps.google.com/">Google</a>',
                        maxZoom: 20,
                        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                    })
            };

            // Layer groups for toggle
            const layerGroups = {
                satellite: L.layerGroup([tileLayers.satellite]),
                satelliteLabels: L.layerGroup([tileLayers.satellite, tileLayers.satelliteLabels]),
                terrain: L.layerGroup([tileLayers.terrain]),
                street: L.layerGroup([tileLayers.street]),
                dark: L.layerGroup([tileLayers.dark]),
                googleSatellite: L.layerGroup([tileLayers.googleSatellite]),
                googleHybrid: L.layerGroup([tileLayers.googleHybrid])
            };

            // Default: satellite with labels
            layerGroups.satelliteLabels.addTo(map);

            // ---------- 3D Terrain Viewer (Three.js) ----------
            let threeContainer = null;
            let threeScene = null;
            let threeCamera = null;
            let threeRenderer = null;
            let is3DMode = false;
            let terrainMesh = null;
            let threeControls = null;
            let terrainData = null;

            // Three.js setup for 3D terrain
            function initThreeJS() {
                // Create container
                threeContainer = document.createElement('div');
                threeContainer.style.position = 'absolute';
                threeContainer.style.top = '0';
                threeContainer.style.left = '0';
                threeContainer.style.width = '100%';
                threeContainer.style.height = '100%';
                threeContainer.style.pointerEvents = 'none';
                threeContainer.style.zIndex = '1';
                threeContainer.style.display = 'none';
                document.getElementById('map').appendChild(threeContainer);

                // Scene
                threeScene = new THREE.Scene();
                threeScene.background = new THREE.Color(0x0a0a1a);

                // Camera
                threeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                threeCamera.position.set(0, 50, 30);
                threeCamera.lookAt(0, 0, 0);

                // Renderer
                threeRenderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });
                threeRenderer.setSize(window.innerWidth, window.innerHeight);
                threeRenderer.setPixelRatio(window.devicePixelRatio);
                threeContainer.appendChild(threeRenderer.domElement);

                // Lights
                const ambientLight = new THREE.AmbientLight(0x404060);
                threeScene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(10, 30, 20);
                threeScene.add(dirLight);

                const dirLight2 = new THREE.DirectionalLight(0x8888ff, 0.5);
                dirLight2.position.set(-10, 20, -20);
                threeScene.add(dirLight2);

                // Stars
                const starsGeometry = new THREE.BufferGeometry();
                const starsCount = 3000;
                const starsPositions = new Float32Array(starsCount * 3);
                for (let i = 0; i < starsCount * 3; i++) {
                    starsPositions[i] = (Math.random() - 0.5) * 1000;
                }
                starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
                const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
                const stars = new THREE.Points(starsGeometry, starsMaterial);
                threeScene.add(stars);

                // Create terrain
                createTerrain();

                // Handle resize
                window.addEventListener('resize', () => {
                    if (threeRenderer) {
                        threeRenderer.setSize(window.innerWidth, window.innerHeight);
                        threeCamera.aspect = window.innerWidth / window.innerHeight;
                        threeCamera.updateProjectionMatrix();
                    }
                });

                // Animation loop
                animateThree();
            }

            function createTerrain() {
                // Create a grid of points for terrain
                const size = 40;
                const segments = 100;
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const colors = [];
                const indices = [];

                // Generate terrain using Perlin-like noise (simplified)
                for (let i = 0; i <= segments; i++) {
                    for (let j = 0; j <= segments; j++) {
                        const x = (i / segments - 0.5) * size;
                        const z = (j / segments - 0.5) * size;

                        // Height using multiple octaves of noise
                        let height = 0;
                        let amplitude = 1;
                        let frequency = 1;
                        for (let octave = 0; octave < 4; octave++) {
                            height += amplitude * (Math.sin(x * frequency * 0.3) * Math.cos(z * frequency * 0.3) +
                                Math.sin(x * frequency * 0.7 + z * frequency * 0.5) * 0.5);
                            amplitude *= 0.5;
                            frequency *= 2;
                        }
                        height *= 2;

                        vertices.push(x, height, z);

                        // Color based on height
                        const h = (height + 4) / 8;
                        const r = 0.1 + h * 0.3;
                        const g = 0.1 + h * 0.4;
                        const b = 0.2 + h * 0.6;
                        colors.push(r, g, b);
                    }
                }

                // Create indices for triangles
                for (let i = 0; i < segments; i++) {
                    for (let j = 0; j < segments; j++) {
                        const a = i * (segments + 1) + j;
                        const b = i * (segments + 1) + j + 1;
                        const c = (i + 1) * (segments + 1) + j;
                        const d = (i + 1) * (segments + 1) + j + 1;

                        indices.push(a, b, c);
                        indices.push(b, d, c);
                    }
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();

                const material = new THREE.MeshPhongMaterial({
                    vertexColors: true,
                    flatShading: false,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9,
                    wireframe: false
                });

                terrainMesh = new THREE.Mesh(geometry, material);
                threeScene.add(terrainMesh);

                // Add wireframe overlay
                const wireframeMaterial = new THREE.MeshPhongMaterial({
                    color: 0x6c5ce7,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.05
                });
                const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
                terrainMesh.add(wireframeMesh);

                terrainData = { geometry, material };
            }

            function animateThree() {
                if (!threeRenderer) return;

                requestAnimationFrame(animateThree);

                if (threeControls) {
                    threeControls.update();
                }

                if (terrainMesh) {
                    terrainMesh.rotation.y += 0.0002;
                }

                threeRenderer.render(threeScene, threeCamera);
            }

            // Toggle 3D mode
            function toggle3DMode() {
                is3DMode = !is3DMode;

                if (is3DMode) {
                    if (!threeContainer) {
                        initThreeJS();
                    }
                    threeContainer.style.display = 'block';
                    document.getElementById('toggle3DBtn').textContent = '🌍 2D Mode';
                    document.getElementById('toggle3DBtn').className = 'btn primary';
                    document.querySelector('.coords-display').style.display = 'none';
                    showToast('🌍 3D Terrain Mode Activated');
                } else {
                    if (threeContainer) {
                        threeContainer.style.display = 'none';
                    }
                    document.getElementById('toggle3DBtn').textContent = '🌍 3D Mode';
                    document.getElementById('toggle3DBtn').className = 'btn';
                    document.querySelector('.coords-display').style.display = 'block';
                    showToast('🗺️ 2D Map Mode');
                }
            }

            // ---------- Layer Switching ----------
            let currentLayer = 'satelliteLabels';

            function switchLayer(layerName) {
                // Remove all layers
                Object.values(layerGroups).forEach(group => {
                    map.removeLayer(group);
                });

                // Add selected
                if (layerGroups[layerName]) {
                    layerGroups[layerName].addTo(map);
                    currentLayer = layerName;
                    showToast(`🗺️ Switched to ${layerName} mode`);
                }
            }

            // ---------- Search ----------
            async function searchLocation(query) {
                if (!query.trim()) return;
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`
                    );
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const result = data[0];
                        const lat = parseFloat(result.lat);
                        const lng = parseFloat(result.lon);
                        map.setView([lat, lng], 14);
                        showToast(`📍 Found: ${result.display_name}`);

                        // Add temporary marker
                        const marker = L.marker([lat, lng]).addTo(map);
                        marker.bindPopup(`📍 ${result.display_name}`).openPopup();
                        setTimeout(() => {
                            map.removeLayer(marker);
                        }, 5000);
                    } else {
                        showToast('❌ Location not found');
                    }
                } catch (error) {
                    showToast('❌ Search failed');
                    console.warn('Search error:', error);
                }
            }

            // ---------- Reset View ----------
            function resetView() {
                map.setView([20, 0], 3);
                showToast('🔄 View reset');
            }

            // ---------- Toast ----------
            function showToast(message) {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                toastMsg.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ---------- Coordinates Display ----------
            map.on('mousemove', function(e) {
                document.getElementById('coordsDisplay').textContent =
                    `🌍 ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            });

            // ---------- Event Listeners ----------
            document.getElementById('searchBtn').addEventListener('click', () => {
                const query = document.getElementById('searchInput').value;
                searchLocation(query);
            });

            document.getElementById('searchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const query = document.getElementById('searchInput').value;
                    searchLocation(query);
                }
            });

            document.getElementById('resetViewBtn').addEventListener('click', resetView);
            document.getElementById('toggle3DBtn').addEventListener('click', toggle3DMode);
            document.getElementById('satelliteBtn').addEventListener('click', () => switchLayer('satelliteLabels'));
            document.getElementById('terrainBtn').addEventListener('click', () => switchLayer('terrain'));
            document.getElementById('streetBtn').addEventListener('click', () => switchLayer('street'));

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === '3') toggle3DMode();
                if (e.key === 'r' || e.key === 'R') resetView();
                if (e.key === 's' || e.key === 'S') switchLayer('satelliteLabels');
                if (e.key === 't' || e.key === 'T') switchLayer('terrain');
                if (e.key === 'm' || e.key === 'M') switchLayer('street');
                if (e.key === 'd' || e.key === 'D') switchLayer('dark');
                if (e.key === 'f' || e.key === 'F') {
                    document.getElementById('searchInput').focus();
                }
            });

            // ---------- Loading ----------
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                }, 500);
            }, 1500);

            // ---------- Init ----------
            console.log('🛰️ Satellite Map loaded!');
            console.log('💡 Tips:');
            console.log('  - Use the buttons to switch between Satellite, Terrain, and Street views');
            console.log('  - Click "3D Mode" for a 3D terrain view');
            console.log('  - Search any location using the search bar');
            console.log('  - Keyboard shortcuts:');
            console.log('    - 3: Toggle 3D mode');
            console.log('    - R: Reset view');
            console.log('    - S: Satellite view');
            console.log('    - T: Terrain view');
            console.log('    - M: Street view');
            console.log('    - D: Dark view');
            console.log('    - F: Focus search');
            console.log('  - Hover over the map to see coordinates');

            // Add some default markers (world landmarks)
            const landmarks = [
                { lat: 48.8566, lng: 2.3522, name: '🗼 Paris, France' },
                { lat: 40.7128, lng: -74.0060, name: '🗽 New York, USA' },
                { lat: 35.6762, lng: 139.6503, name: '🗾 Tokyo, Japan' },
                { lat: -33.8688, lng: 151.2093, name: '🦘 Sydney, Australia' },
                { lat: 51.5074, lng: -0.1278, name: '🏰 London, UK' },
                { lat: -22.9068, lng: -43.1729, name: '⛰️ Rio de Janeiro, Brazil' },
                { lat: 25.2048, lng: 55.2708, name: '🏙️ Dubai, UAE' },
                { lat: 19.0760, lng: 72.8777, name: '🇮🇳 Mumbai, India' }
            ];

            setTimeout(() => {
                landmarks.forEach((loc, i) => {
                    setTimeout(() => {
                        const marker = L.marker([loc.lat, loc.lng], {
                            icon: L.divIcon({
                                className: 'landmark-marker',
                                html: '📍',
                                iconSize: [20, 20],
                                iconAnchor: [10, 20]
                            })
                        }).addTo(map);
                        marker.bindPopup(`<b>${loc.name}</b>`);
                    }, i * 200);
                });
            }, 2000);

        })();
    </script>
</body>
</html>
