<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎨 AI Art Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            min-height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 700;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo span {
            background: linear-gradient(135deg, #fd79a8, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section {
            margin: 0.8rem 0;
        }
        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #54668f;
            margin-bottom: 0.4rem;
        }

        .style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem;
        }
        .style-btn {
            padding: 0.5rem 0.2rem;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            color: #8899c7;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.7rem;
        }
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }
        .style-btn.active {
            border-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.15);
            color: white;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.1);
        }
        .style-btn .preview {
            width: 100%;
            height: 40px;
            border-radius: 0.4rem;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #6c5ce7, #fd79a8);
        }

        .control-group {
            margin: 0.4rem 0;
        }
        .control-group label {
            font-size: 0.75rem;
            color: #8899c7;
            display: flex;
            justify-content: space-between;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #6c5ce7;
            background: transparent;
            cursor: pointer;
            margin: 0.2rem 0;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            -webkit-appearance: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
        }

        .color-picker-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .color-picker-group input[type="color"] {
            width: 35px;
            height: 35px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem;
            margin: 0.4rem 0;
        }
        .action-btn {
            padding: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            color: #dce5ff;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.15s;
            text-align: center;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.02);
        }
        .action-btn.primary {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }
        .action-btn.primary:hover {
            background: #7d6ff0;
        }
        .action-btn.success {
            background: #00b894;
            border-color: #00b894;
            color: white;
        }
        .action-btn.success:hover {
            background: #00d2a0;
        }

        .status-text {
            font-size: 0.75rem;
            color: #54668f;
            text-align: center;
            padding: 0.3rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1.5rem;
            gap: 0.8rem;
            position: relative;
        }

        .canvas-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.3);
        }
        .canvas-wrapper canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay-info {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: opacity 0.3s;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            border-radius: 1.5rem;
        }
        .loading-overlay.show {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            font-size: 0.9rem;
            color: #8899c7;
        }

        .seed-display {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            font-family: monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 0.8rem;
            }
            .main-content {
                padding: 0.8rem;
            }
            .style-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .action-buttons {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .style-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .sidebar {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                🎨 <span>AI Art Studio</span>
            </div>

            <div class="section">
                <div class="section-title">🎭 Art Style</div>
                <div class="style-grid" id="styleGrid">
                    <button class="style-btn active" data-style="abstract">
                        <div class="preview" style="background:linear-gradient(135deg,#6c5ce7,#fd79a8);"></div>
                        Abstract
                    </button>
                    <button class="style-btn" data-style="flow">
                        <div class="preview" style="background:linear-gradient(135deg,#00b894,#00cec9);"></div>
                        Flow
                    </button>
                    <button class="style-btn" data-style="geometric">
                        <div class="preview" style="background:linear-gradient(135deg,#fdcb6e,#e17055);"></div>
                        Geometric
                    </button>
                    <button class="style-btn" data-style="nature">
                        <div class="preview" style="background:linear-gradient(135deg,#00b894,#55efc4);"></div>
                        Nature
                    </button>
                    <button class="style-btn" data-style="cosmic">
                        <div class="preview" style="background:linear-gradient(135deg,#6c5ce7,#0984e3);"></div>
                        Cosmic
                    </button>
                    <button class="style-btn" data-style="glitch">
                        <div class="preview" style="background:linear-gradient(135deg,#e17055,#6c5ce7);"></div>
                        Glitch
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">🎨 Colors</div>
                <div class="color-picker-group">
                    <input type="color" id="color1" value="#6c5ce7" />
                    <input type="color" id="color2" value="#fd79a8" />
                    <input type="color" id="color3" value="#00cec9" />
                    <input type="color" id="color4" value="#fdcb6e" />
                    <input type="color" id="bgColor" value="#0a0a1a" />
                </div>
            </div>

            <div class="section">
                <div class="section-title">⚙️ Parameters</div>
                <div class="control-group">
                    <label>Complexity <span id="complexityVal">5</span></label>
                    <input type="range" id="complexity" min="1" max="10" value="5" />
                </div>
                <div class="control-group">
                    <label>Symmetry <span id="symmetryVal">4</span></label>
                    <input type="range" id="symmetry" min="1" max="12" value="4" />
                </div>
                <div class="control-group">
                    <label>Chaos <span id="chaosVal">3</span></label>
                    <input type="range" id="chaos" min="1" max="10" value="3" />
                </div>
                <div class="control-group">
                    <label>Resolution <span id="resolutionVal">512</span></label>
                    <input type="range" id="resolution" min="256" max="1024" value="512" step="128" />
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn primary" id="generateBtn">🎨 Generate</button>
                <button class="action-btn success" id="saveBtn">💾 Save</button>
                <button class="action-btn" id="randomBtn">🎲 Random</button>
            </div>

            <div class="status-text" id="status">Ready to create art</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="canvas-wrapper">
                <canvas id="artCanvas"></canvas>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div class="loading-text">🧠 AI is creating your artwork...</div>
                </div>
                <div class="seed-display" id="seedDisplay">Seed: 0</div>
                <div class="overlay-info">✨ Click "Generate" to create new art</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const canvas = document.getElementById('artCanvas');
            const ctx = canvas.getContext('2d');
            const styleGrid = document.getElementById('styleGrid');
            const generateBtn = document.getElementById('generateBtn');
            const saveBtn = document.getElementById('saveBtn');
            const randomBtn = document.getElementById('randomBtn');
            const statusText = document.getElementById('statusText');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const seedDisplay = document.getElementById('seedDisplay');

            const color1 = document.getElementById('color1');
            const color2 = document.getElementById('color2');
            const color3 = document.getElementById('color3');
            const color4 = document.getElementById('color4');
            const bgColor = document.getElementById('bgColor');

            const complexitySlider = document.getElementById('complexity');
            const symmetrySlider = document.getElementById('symmetry');
            const chaosSlider = document.getElementById('chaos');
            const resolutionSlider = document.getElementById('resolution');

            const complexityVal = document.getElementById('complexityVal');
            const symmetryVal = document.getElementById('symmetryVal');
            const chaosVal = document.getElementById('chaosVal');
            const resolutionVal = document.getElementById('resolutionVal');

            // ---------- State ----------
            let currentStyle = 'abstract';
            let seed = Date.now();
            let isGenerating = false;
            let currentImageData = null;

            // ---------- Canvas resize ----------
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height) * 0.95;
                canvas.width = parseInt(resolutionSlider.value);
                canvas.height = parseInt(resolutionSlider.value);
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // ---------- Random number generator with seed ----------
            function seededRandom(seedVal) {
                let s = seedVal;
                return function() {
                    s = (s * 9301 + 49297) % 233280;
                    return s / 233280;
                };
            }

            // ---------- Art generators ----------
            function generateAbstract(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                // Background
                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const numShapes = 20 + params.complexity * 15;
                const symmetry = params.symmetry;
                const chaos = params.chaos / 10;

                for (let i = 0; i < numShapes; i++) {
                    const x = random() * w;
                    const y = random() * h;
                    const size = 20 + random() * 100 * (1 + chaos);
                    const angle = random() * Math.PI * 2;

                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];
                    ctx.fillStyle = colors_arr[colorIdx];
                    ctx.globalAlpha = 0.3 + random() * 0.5;

                    // Symmetry
                    for (let s = 0; s < symmetry; s++) {
                        const rotation = (s / symmetry) * Math.PI * 2;
                        ctx.save();
                        ctx.translate(w / 2, h / 2);
                        ctx.rotate(rotation);
                        ctx.translate(x - w / 2, y - h / 2);

                        const shapeType = Math.floor(random() * 4);
                        ctx.beginPath();
                        if (shapeType === 0) {
                            // Circle
                            ctx.arc(0, 0, size * (0.5 + random() * 0.5), 0, Math.PI * 2);
                        } else if (shapeType === 1) {
                            // Rectangle
                            const rw = size * (0.5 + random() * 0.8);
                            const rh = size * (0.5 + random() * 0.8);
                            ctx.rect(-rw / 2, -rh / 2, rw, rh);
                        } else if (shapeType === 2) {
                            // Triangle
                            for (let j = 0; j < 3; j++) {
                                const a = (j / 3) * Math.PI * 2 + angle;
                                const r = size * (0.5 + random() * 0.5);
                                if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                                else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                            }
                            ctx.closePath();
                        } else {
                            // Star
                            const points = 5 + Math.floor(random() * 5);
                            for (let j = 0; j < points * 2; j++) {
                                const a = (j / (points * 2)) * Math.PI * 2 + angle;
                                const r = j % 2 === 0 ? size * (0.5 + random() * 0.3) : size * (0.2 + random() * 0.2);
                                if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                                else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                            }
                            ctx.closePath();
                        }
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Add some lines
                ctx.globalAlpha = 0.2;
                for (let i = 0; i < numShapes * 0.3; i++) {
                    const x1 = random() * w;
                    const y1 = random() * h;
                    const x2 = random() * w;
                    const y2 = random() * h;
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];
                    ctx.strokeStyle = colors_arr[colorIdx];
                    ctx.lineWidth = 1 + random() * 3;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            function generateFlow(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const numLines = 30 + params.complexity * 20;
                const chaos = params.chaos / 10;

                for (let i = 0; i < numLines; i++) {
                    const startX = random() * w;
                    const startY = random() * h;
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];

                    ctx.strokeStyle = colors_arr[colorIdx];
                    ctx.lineWidth = 1 + random() * 4;
                    ctx.globalAlpha = 0.3 + random() * 0.4;

                    let x = startX,
                        y = startY;
                    ctx.beginPath();
                    ctx.moveTo(x, y);

                    const steps = 20 + Math.floor(random() * 30);
                    for (let j = 0; j < steps; j++) {
                        const angle = random() * Math.PI * 2;
                        const dist = 5 + random() * 20 * (1 + chaos);
                        x += Math.cos(angle) * dist;
                        y += Math.sin(angle) * dist;
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            function generateGeometric(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const symmetry = params.symmetry;
                const complexity = params.complexity;
                const numShapes = 15 + complexity * 10;

                for (let i = 0; i < numShapes; i++) {
                    const x = random() * w;
                    const y = random() * h;
                    const size = 30 + random() * 80;
                    const angle = random() * Math.PI * 2;

                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];
                    ctx.fillStyle = colors_arr[colorIdx];
                    ctx.globalAlpha = 0.2 + random() * 0.4;

                    const sides = 3 + Math.floor(random() * 5);
                    const radius = size * (0.5 + random() * 0.5);

                    for (let s = 0; s < symmetry; s++) {
                        const rotation = (s / symmetry) * Math.PI * 2;
                        ctx.save();
                        ctx.translate(w / 2, h / 2);
                        ctx.rotate(rotation);
                        ctx.translate(x - w / 2, y - h / 2);
                        ctx.rotate(angle);

                        ctx.beginPath();
                        for (let j = 0; j < sides; j++) {
                            const a = (j / sides) * Math.PI * 2 - Math.PI / 2;
                            const r = radius * (0.7 + random() * 0.3);
                            if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = colors_arr[(colorIdx + 1) % 4];
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.restore();
                    }
                }
                ctx.globalAlpha = 1;
            }

            function generateNature(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const chaos = params.chaos / 10;
                const numTrees = 8 + params.complexity * 4;

                for (let t = 0; t < numTrees; t++) {
                    const x = 50 + random() * (w - 100);
                    const y = h - 20 - random() * 30;
                    const height = 50 + random() * 150 * (1 + chaos);
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];

                    // Trunk
                    ctx.strokeStyle = '#2d1b69';
                    ctx.lineWidth = 4 + random() * 6;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + (random() - 0.5) * 10, y - height);
                    ctx.stroke();

                    // Branches
                    function drawBranch(x1, y1, angle, length, depth) {
                        if (depth > 4 || length < 5) return;
                        const endX = x1 + Math.cos(angle) * length;
                        const endY = y1 - Math.sin(angle) * length;
                        ctx.strokeStyle = colors_arr[colorIdx % 4];
                        ctx.lineWidth = Math.max(1, depth * 1.5);
                        ctx.globalAlpha = 0.5 + depth / 8;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();

                        const branchAngle = 0.4 + random() * 0.6;
                        drawBranch(endX, endY, angle + branchAngle, length * (0.6 + random() * 0.2), depth + 1);
                        drawBranch(endX, endY, angle - branchAngle, length * (0.6 + random() * 0.2), depth + 1);
                    }

                    drawBranch(x, y - height * 0.1, -Math.PI / 2 + (random() - 0.5) * 0.5, height * 0.3, 1);

                    // Leaves
                    ctx.globalAlpha = 0.3 + random() * 0.3;
                    for (let i = 0; i < 20 + random() * 30; i++) {
                        const lx = x + (random() - 0.5) * height * 0.8;
                        const ly = y - height * (0.3 + random() * 0.6);
                        const size = 5 + random() * 15;
                        ctx.fillStyle = colors_arr[(colorIdx + 2) % 4];
                        ctx.beginPath();
                        ctx.arc(lx, ly, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            function generateCosmic(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const numStars = 200 + params.complexity * 100;
                const symmetry = params.symmetry;

                // Stars
                for (let i = 0; i < numStars; i++) {
                    const x = random() * w;
                    const y = random() * h;
                    const size = 0.5 + random() * 2;
                    ctx.fillStyle = `rgba(255,255,255,${0.3 + random() * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Nebula clouds
                for (let c = 0; c < 3 + params.complexity; c++) {
                    const cx = random() * w;
                    const cy = random() * h;
                    const radius = 50 + random() * 200;
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];

                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                    grad.addColorStop(0, colors_arr[colorIdx] + '33');
                    grad.addColorStop(0.5, colors_arr[(colorIdx + 1) % 4] + '22');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

                    // Galaxy spiral arms
                    if (c < 2) {
                        for (let s = 0; s < symmetry; s++) {
                            const rotation = (s / symmetry) * Math.PI * 2;
                            ctx.save();
                            ctx.translate(w / 2, h / 2);
                            ctx.rotate(rotation);
                            ctx.translate(-w / 2, -h / 2);

                            ctx.globalAlpha = 0.1 + random() * 0.2;
                            ctx.strokeStyle = colors_arr[colorIdx];
                            ctx.lineWidth = 2 + random() * 5;
                            ctx.beginPath();
                            for (let t = 0; t < 50; t++) {
                                const angle = t / 50 * Math.PI * 2 * 2;
                                const r = t / 50 * radius;
                                const x2 = cx + Math.cos(angle + c) * r;
                                const y2 = cy + Math.sin(angle + c) * r;
                                if (t === 0) ctx.moveTo(x2, y2);
                                else ctx.lineTo(x2, y2);
                            }
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                }
                ctx.globalAlpha = 1;
            }

            function generateGlitch(random, colors, params) {
                const w = canvas.width;
                const h = canvas.height;
                const ctx = canvas.getContext('2d');

                const bg = bgColor.value;
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const numShapes = 30 + params.complexity * 20;
                const chaos = params.chaos / 10;

                // Draw colorful shapes
                for (let i = 0; i < numShapes; i++) {
                    const x = random() * w;
                    const y = random() * h;
                    const size = 10 + random() * 60;
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];

                    ctx.fillStyle = colors_arr[colorIdx];
                    ctx.globalAlpha = 0.2 + random() * 0.3;

                    const shapeType = Math.floor(random() * 3);
                    ctx.beginPath();
                    if (shapeType === 0) {
                        ctx.rect(x - size / 2, y - size / 2, size, size);
                    } else if (shapeType === 1) {
                        ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    } else {
                        ctx.ellipse(x, y, size / 2, size / 3, random() * Math.PI, 0, Math.PI * 2);
                    }
                    ctx.fill();
                }

                // Glitch effects
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < 20 + params.complexity * 5; i++) {
                    const x = random() * w;
                    const y = random() * h;
                    const width = 10 + random() * 60;
                    const height = 2 + random() * 8;
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];

                    ctx.fillStyle = colors_arr[colorIdx];
                    ctx.fillRect(x, y, width, height);

                    // Offset copy
                    const offsetX = (random() - 0.5) * 30 * chaos;
                    const offsetY = (random() - 0.5) * 10 * chaos;
                    ctx.fillStyle = colors_arr[(colorIdx + 1) % 4];
                    ctx.globalAlpha = 0.1;
                    ctx.fillRect(x + offsetX, y + offsetY, width, height);
                }

                // Scan lines
                ctx.globalAlpha = 0.05;
                for (let i = 0; i < h; i += 3) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, i, w, 1);
                }
                ctx.globalAlpha = 1;

                // Pixel blocks
                ctx.globalAlpha = 0.1;
                for (let i = 0; i < 30; i++) {
                    const x = Math.floor(random() * w / 10) * 10;
                    const y = Math.floor(random() * h / 10) * 10;
                    const size = 10 + Math.floor(random() * 30);
                    const colorIdx = Math.floor(random() * 4);
                    const colors_arr = [color1.value, color2.value, color3.value, color4.value];
                    ctx.fillStyle = colors_arr[colorIdx];
                    ctx.fillRect(x, y, size, size);
                }
                ctx.globalAlpha = 1;
            }

            // ---------- Main generate function ----------
            function generateArt() {
                if (isGenerating) return;
                isGenerating = true;
                loadingOverlay.classList.add('show');
                statusText.textContent = '🧠 AI is creating...';

                // Use setTimeout to allow UI to update
                setTimeout(() => {
                    try {
                        const w = parseInt(resolutionSlider.value);
                        const h = w;
                        canvas.width = w;
                        canvas.height = h;
                        resizeCanvas();

                        const random = seededRandom(seed);

                        const params = {
                            complexity: parseInt(complexitySlider.value),
                            symmetry: parseInt(symmetrySlider.value),
                            chaos: parseInt(chaosSlider.value),
                        };

                        const colors = [color1.value, color2.value, color3.value, color4.value];

                        // Generate based on style
                        switch (currentStyle) {
                            case 'abstract':
                                generateAbstract(random, colors, params);
                                break;
                            case 'flow':
                                generateFlow(random, colors, params);
                                break;
                            case 'geometric':
                                generateGeometric(random, colors, params);
                                break;
                            case 'nature':
                                generateNature(random, colors, params);
                                break;
                            case 'cosmic':
                                generateCosmic(random, colors, params);
                                break;
                            case 'glitch':
                                generateGlitch(random, colors, params);
                                break;
                            default:
                                generateAbstract(random, colors, params);
                        }

                        // Save image data for export
                        currentImageData = canvas.toDataURL('image/png');

                        seedDisplay.textContent = `Seed: ${seed}`;
                        statusText.textContent = '✅ Art generated successfully!';
                        loadingOverlay.classList.remove('show');

                    } catch (error) {
                        console.error('Generation error:', error);
                        statusText.textContent = '❌ Error generating art';
                        loadingOverlay.classList.remove('show');
                    }
                    isGenerating = false;
                }, 300);
            }

            // ---------- Random seed ----------
            function randomSeed() {
                seed = Math.floor(Math.random() * 1000000000);
                // Randomize colors
                const randomColor = () => {
                    const hue = Math.random() * 360;
                    return `hsl(${hue}, 70%, 60%)`;
                };
                color1.value = randomColor();
                color2.value = randomColor();
                color3.value = randomColor();
                color4.value = randomColor();

                // Random parameters
                complexitySlider.value = 1 + Math.floor(Math.random() * 9);
                symmetrySlider.value = 1 + Math.floor(Math.random() * 11);
                chaosSlider.value = 1 + Math.floor(Math.random() * 9);
                resolutionSlider.value = [256, 384, 512, 640, 768, 1024][Math.floor(Math.random() * 6)];

                updateLabels();
                generateArt();
            }

            // ---------- Update labels ----------
            function updateLabels() {
                complexityVal.textContent = complexitySlider.value;
                symmetryVal.textContent = symmetrySlider.value;
                chaosVal.textContent = chaosSlider.value;
                resolutionVal.textContent = resolutionSlider.value;
            }

            // ---------- Save art ----------
            function saveArt() {
                if (!currentImageData) {
                    statusText.textContent = '⚠️ Generate art first!';
                    return;
                }
                const link = document.createElement('a');
                link.download = `ai-art-${Date.now()}.png`;
                link.href = currentImageData;
                link.click();
                statusText.textContent = '💾 Art saved!';
            }

            // ---------- Event listeners ----------
            // Style selection
            styleGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                styleGrid.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStyle = btn.dataset.style;
                generateArt();
            });

            // Generate button
            generateBtn.addEventListener('click', () => {
                seed = Date.now() + Math.random() * 1000000;
                generateArt();
            });

            // Save button
            saveBtn.addEventListener('click', saveArt);

            // Random button
            randomBtn.addEventListener('click', randomSeed);

            // Sliders
            [complexitySlider, symmetrySlider, chaosSlider, resolutionSlider].forEach(slider => {
                slider.addEventListener('input', updateLabels);
                slider.addEventListener('change', generateArt);
            });

            // Color pickers
            [color1, color2, color3, color4, bgColor].forEach(input => {
                input.addEventListener('input', generateArt);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'g' || e.key === 'G') {
                    seed = Date.now() + Math.random() * 1000000;
                    generateArt();
                }
                if (e.key === 's' || e.key === 'S') {
                    saveArt();
                }
                if (e.key === 'r' || e.key === 'R') {
                    randomSeed();
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    seed = Date.now() + Math.random() * 1000000;
                    generateArt();
                }
            });

            // ---------- Init ----------
            function init() {
                updateLabels();
                seed = Date.now();
                generateArt();
                statusText.textContent = '🎨 Ready to create art!';
                console.log('🎨 AI Art Studio loaded!');
                console.log('💡 Tips:');
                console.log('  - Click "Generate" or press Space for new art');
                console.log('  - Press S to save, R for random');
                console.log('  - Adjust parameters for unique variations');
                console.log('  - Try different art styles!');
            }

            init();

        })();
    </script>
</body>
