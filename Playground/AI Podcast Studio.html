<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎙️ AI Podcast Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            min-height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 700;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo span {
            background: linear-gradient(135deg, #fd79a8, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section {
            margin: 0.6rem 0;
        }
        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #54668f;
            margin-bottom: 0.3rem;
        }

        .recording-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #dce5ff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }
        .btn-primary:hover {
            background: #7d6ff0;
        }
        .btn-danger {
            background: #e17055;
            border-color: #e17055;
            color: white;
        }
        .btn-danger:hover {
            background: #e74c6f;
        }
        .btn-success {
            background: #00b894;
            border-color: #00b894;
            color: white;
        }
        .btn-success:hover {
            background: #00d2a0;
        }
        .btn-warning {
            background: #fdcb6e;
            border-color: #fdcb6e;
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #ffeaa7;
        }
        .btn-full {
            grid-column: 1 / -1;
        }

        .voice-select {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #dce5ff;
            font-size: 0.85rem;
            outline: none;
            margin: 0.2rem 0;
        }
        .voice-select option {
            background: #1a1a2e;
        }

        .text-input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #dce5ff;
            font-size: 0.85rem;
            outline: none;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            transition: 0.15s;
        }
        .text-input:focus {
            border-color: #6c5ce7;
            background: rgba(255, 255, 255, 0.05);
        }

        .transcript-list {
            flex: 1;
            overflow-y: auto;
            margin: 0.3rem 0;
        }
        .transcript-list::-webkit-scrollbar {
            width: 3px;
        }
        .transcript-list::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        .transcript-item {
            padding: 0.4rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            margin-bottom: 0.2rem;
            font-size: 0.8rem;
            border-left: 3px solid #6c5ce7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transcript-item .time {
            color: #54668f;
            font-size: 0.65rem;
            font-family: monospace;
        }
        .transcript-item .text {
            flex: 1;
            margin: 0 0.5rem;
            word-break: break-word;
        }
        .transcript-item .delete-transcript {
            background: none;
            border: none;
            color: #54668f;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .transcript-item .delete-transcript:hover {
            color: #e17055;
        }

        .status-text {
            font-size: 0.75rem;
            color: #54668f;
            text-align: center;
            padding: 0.3rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            margin-top: auto;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1.5rem;
            gap: 0.8rem;
            position: relative;
        }

        .studio-view {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        /* Waveform */
        .waveform-container {
            flex: 1;
            min-height: 0;
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.3);
        }
        .waveform-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .waveform-overlay {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .recording-indicator {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-size: 0.7rem;
            color: #e17055;
            border: 1px solid rgba(225, 112, 85, 0.2);
            display: none;
        }
        .recording-indicator.show {
            display: flex;
        }
        .recording-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e17055;
            animation: pulse-dot 0.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* Player controls */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #dce5ff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 50%;
            transition: 0.1s;
        }
        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .player-controls .play-btn {
            font-size: 1.8rem;
            color: #6c5ce7;
        }
        .player-controls .play-btn:hover {
            color: #7d6ff0;
        }
        .player-controls .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 100px;
        }
        .player-controls .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }
        .player-controls .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #fd79a8);
            border-radius: 10px;
            width: 0%;
            transition: 0.1s;
        }
        .player-controls .time-display {
            font-size: 0.75rem;
            color: #8899c7;
            min-width: 60px;
            text-align: center;
            font-family: monospace;
        }
        .player-controls .volume-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .player-controls .volume-control input[type="range"] {
            width: 50px;
            accent-color: #6c5ce7;
            background: transparent;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 0.8rem;
            }
            .main-content {
                padding: 0.8rem;
            }
            .recording-controls {
                grid-template-columns: 1fr 1fr;
            }
            .player-controls {
                padding: 0.4rem 0.8rem;
                gap: 0.4rem;
            }
            .player-controls .volume-control input[type="range"] {
                width: 40px;
            }
            .text-input {
                min-height: 60px;
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                max-height: 50vh;
            }
            .recording-controls {
                grid-template-columns: 1fr 1fr;
            }
            .player-controls .progress-container {
                min-width: 60px;
            }
            .player-controls .time-display {
                min-width: 40px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                🎙️ <span>AI Podcast Studio</span>
            </div>

            <div class="section">
                <div class="section-title">🎤 Recording</div>
                <div class="recording-controls">
                    <button class="btn btn-danger" id="recordBtn">🔴 Record</button>
                    <button class="btn" id="stopBtn">⏹️ Stop</button>
                    <button class="btn btn-success" id="playbackBtn">▶️ Playback</button>
                    <button class="btn" id="exportBtn">📥 Export</button>
                    <button class="btn btn-warning btn-full" id="clearBtn">🗑️ Clear All</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">🗣️ AI Voice Synthesis</div>
                <select class="voice-select" id="voiceSelect">
                    <option value="default">Default Voice</option>
                    <option value="female1">🎤 Female (Professional)</option>
                    <option value="female2">🎤 Female (Warm)</option>
                    <option value="male1">🎙️ Male (Deep)</option>
                    <option value="male2">🎙️ Male (Friendly)</option>
                    <option value="robot">🤖 Robot</option>
                </select>
                <textarea class="text-input" id="ttsText" placeholder="Enter text to convert to speech...">Welcome to AI Podcast Studio! This is your AI voice assistant, ready to help you create amazing podcast content.</textarea>
                <button class="btn btn-primary btn-full" id="ttsBtn" style="margin-top:0.3rem;">🔊 Generate Speech</button>
            </div>

            <div class="section">
                <div class="section-title">📝 Transcript</div>
                <div class="transcript-list" id="transcriptList">
                    <div style="color:#54668f;font-size:0.85rem;text-align:center;padding:1rem 0;">
                        No transcript yet.<br />Record audio to generate transcripts.
                    </div>
                </div>
            </div>

            <div class="status-text" id="statusText">🎙️ Ready to record</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="studio-view">
                <div class="waveform-container">
                    <canvas id="waveformCanvas"></canvas>
                    <div class="waveform-overlay">🎵 Audio Waveform</div>
                    <div class="recording-indicator" id="recordingIndicator">
                        <span class="dot"></span>
                        <span>RECORDING</span>
                    </div>
                </div>

                <div class="player-controls">
                    <button id="rewindBtn">⏮️</button>
                    <button class="play-btn" id="playBtn">▶️</button>
                    <button id="forwardBtn">⏭️</button>
                    <div class="progress-container">
                        <span class="time-display" id="currentTime">0:00</span>
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time-display" id="totalTime">0:00</span>
                    </div>
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="70" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            const statusText = document.getElementById('statusText');
            const transcriptList = document.getElementById('transcriptList');
            const recordingIndicator = document.getElementById('recordingIndicator');

            const recordBtn = document.getElementById('recordBtn');
            const stopBtn = document.getElementById('stopBtn');
            const playbackBtn = document.getElementById('playbackBtn');
            const exportBtn = document.getElementById('exportBtn');
            const clearBtn = document.getElementById('clearBtn');
            const playBtn = document.getElementById('playBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const currentTime = document.getElementById('currentTime');
            const totalTime = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const ttsBtn = document.getElementById('ttsBtn');
            const ttsText = document.getElementById('ttsText');
            const voiceSelect = document.getElementById('voiceSelect');

            // ---------- State ----------
            let audioContext = null;
            let analyser = null;
            let dataArray = null;
            let mediaRecorder = null;
            let recordedChunks = [];
            let audioBuffer = null;
            let audioSource = null;
            let isRecording = false;
            let isPlaying = false;
            let audioElement = null;
            let animationId = null;
            let transcripts = [];
            let recordingStartTime = null;

            // ---------- Canvas setup ----------
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = canvas.clientWidth || rect.width || 800;
                canvas.height = canvas.clientHeight || rect.height || 300;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // ---------- Audio Context ----------
            function initAudioContext() {
                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.smoothingTimeConstant = 0.8;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }

            // ---------- Recording ----------
            async function startRecording() {
                if (isRecording) return;

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });

                    initAudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);

                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: 'audio/webm;codecs=opus'
                    });

                    recordedChunks = [];
                    recordingStartTime = Date.now();

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            recordedChunks.push(e.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        audioElement = new Audio(url);
                        audioElement.volume = volumeSlider.value / 100;

                        // Add to transcript (simulated speech recognition)
                        simulateTranscription();

                        statusText.textContent = '✅ Recording saved!';
                        recordingIndicator.classList.remove('show');
                        isRecording = false;
                        recordBtn.textContent = '🔴 Record';
                        recordBtn.className = 'btn btn-danger';
                    };

                    mediaRecorder.start(100);
                    isRecording = true;
                    recordBtn.textContent = '⏹️ Recording...';
                    recordBtn.className = 'btn btn-danger';
                    recordingIndicator.classList.add('show');
                    statusText.textContent = '🔴 Recording...';

                    // Start waveform visualization
                    visualizeRecording();

                } catch (error) {
                    console.error('Recording error:', error);
                    statusText.textContent = '❌ Error: ' + error.message;
                }
            }

            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }

            // ---------- Simulated Transcription ----------
            function simulateTranscription() {
                const mockTranscripts = [
                    'Hello and welcome to the podcast!',
                    'Today we are discussing AI technology and its impact.',
                    'The future of artificial intelligence is incredibly exciting.',
                    'We have some amazing guests joining us today.',
                    'Let\'s dive into the topic of machine learning.',
                    'This has been a fascinating discussion so far.',
                    'Thank you for listening to this episode.',
                    'Make sure to subscribe for more content like this.',
                    'We\'ll be back with more insights next week.',
                    'That\'s all for today\'s show. Goodbye!'
                ];

                const count = Math.floor(Math.random() * 4) + 2;
                for (let i = 0; i < count; i++) {
                    const text = mockTranscripts[Math.floor(Math.random() * mockTranscripts.length)];
                    const time = new Date(Date.now() - Math.random() * 300000);
                    transcripts.push({
                        text: text,
                        time: time,
                        id: Date.now() + Math.random() * 1000 + i
                    });
                }
                renderTranscripts();
                statusText.textContent = `📝 ${count} transcript segments added`;
            }

            // ---------- Render Transcripts ----------
            function renderTranscripts() {
                if (transcripts.length === 0) {
                    transcriptList.innerHTML = `
                        <div style="color:#54668f;font-size:0.85rem;text-align:center;padding:1rem 0;">
                            No transcript yet.<br />Record audio to generate transcripts.
                        </div>
                    `;
                    return;
                }

                let html = '';
                transcripts.slice().reverse().forEach(item => {
                    const timeStr = item.time.toLocaleTimeString('en-US', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                    html += `
                        <div class="transcript-item">
                            <span class="time">${timeStr}</span>
                            <span class="text">${item.text}</span>
                            <button class="delete-transcript" data-id="${item.id}">✕</button>
                        </div>
                    `;
                });
                transcriptList.innerHTML = html;

                transcriptList.querySelectorAll('.delete-transcript').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseFloat(this.dataset.id);
                        transcripts = transcripts.filter(t => t.id !== id);
                        renderTranscripts();
                        statusText.textContent = '🗑️ Transcript deleted';
                    });
                });
            }

            // ---------- Waveform Visualization ----------
            function visualizeRecording() {
                if (!analyser) return;

                const width = canvas.width;
                const height = canvas.height;

                analyser.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, width, height);

                // Draw background grid
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 20; i++) {
                    const y = (i / 20) * height;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }

                // Draw waveform
                const barWidth = width / dataArray.length * 2;
                let x = 0;

                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#6c5ce7');
                gradient.addColorStop(0.5, '#fd79a8');
                gradient.addColorStop(1, '#00cec9');

                for (let i = 0; i < dataArray.length; i++) {
                    const value = dataArray[i] / 255;
                    const barHeight = value * height * 0.9;

                    ctx.fillStyle = gradient;
                    ctx.shadowColor = '#6c5ce7';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
                    ctx.shadowBlur = 0;

                    x += barWidth;
                }

                // Draw center line
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw glow effect
                const glow = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 2);
                glow.addColorStop(0, 'rgba(108, 92, 231, 0.05)');
                glow.addColorStop(1, 'rgba(108, 92, 231, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);

                if (isRecording) {
                    animationId = requestAnimationFrame(visualizeRecording);
                } else {
                    // Draw static visualization
                    drawStaticWaveform();
                }
            }

            function drawStaticWaveform() {
                const width = canvas.width;
                const height = canvas.height;

                ctx.clearRect(0, 0, width, height);

                // Draw a simple static waveform
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#6c5ce7');
                gradient.addColorStop(0.5, '#fd79a8');
                gradient.addColorStop(1, '#00cec9');

                for (let i = 0; i < 200; i++) {
                    const x = (i / 200) * width;
                    const value = Math.random() * 0.8 + 0.2;
                    const barHeight = value * height * 0.6;

                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(x, height / 2 - barHeight / 2, 2, barHeight);
                }
                ctx.globalAlpha = 1;
            }

            // ---------- Playback ----------
            function togglePlayback() {
                if (!audioElement) {
                    statusText.textContent = '⚠️ No audio to play. Record or generate speech first.';
                    return;
                }

                if (isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                    statusText.textContent = '⏸️ Paused';
                    return;
                }

                audioElement.play();
                isPlaying = true;
                playBtn.textContent = '⏸️';
                statusText.textContent = '▶️ Playing...';

                audioElement.onended = () => {
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                    statusText.textContent = '✅ Playback complete';
                };

                audioElement.ontimeupdate = () => {
                    updateProgress();
                };
            }

            function updateProgress() {
                if (!audioElement) return;
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                progressFill.style.width = progress + '%';
                currentTime.textContent = formatTime(audioElement.currentTime);
                totalTime.textContent = formatTime(audioElement.duration);
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${String(secs).padStart(2, '0')}`;
            }

            function seekTo(e) {
                if (!audioElement) return;
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioElement.currentTime = percent * audioElement.duration;
            }

            // ---------- Export ----------
            function exportAudio() {
                if (!audioElement) {
                    statusText.textContent = '⚠️ No audio to export';
                    return;
                }

                // If we have recorded chunks, use those
                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `podcast_${new Date().toISOString().slice(0,10)}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    statusText.textContent = '📥 Audio exported!';
                    return;
                }

                // Otherwise try to export from audio element
                if (audioElement.src) {
                    const a = document.createElement('a');
                    a.href = audioElement.src;
                    a.download = `podcast_${new Date().toISOString().slice(0,10)}.mp3`;
                    a.click();
                    statusText.textContent = '📥 Audio exported!';
                }
            }

            // ---------- Clear ----------
            function clearAll() {
                if (confirm('Clear all recordings and transcripts?')) {
                    recordedChunks = [];
                    transcripts = [];
                    audioElement = null;
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                    progressFill.style.width = '0%';
                    currentTime.textContent = '0:00';
                    totalTime.textContent = '0:00';
                    renderTranscripts();
                    statusText.textContent = '🗑️ All cleared';
                    drawStaticWaveform();
                }
            }

            // ---------- Text-to-Speech ----------
            function generateSpeech() {
                const text = ttsText.value.trim();
                if (!text) {
                    statusText.textContent = '⚠️ Please enter some text';
                    return;
                }

                if (!window.speechSynthesis) {
                    statusText.textContent = '❌ Speech synthesis not supported';
                    return;
                }

                statusText.textContent = '🔊 Generating speech...';
                const utterance = new SpeechSynthesisUtterance(text);

                // Voice selection (simulated)
                const voiceMap = {
                    'default': null,
                    'female1': 'Samantha',
                    'female2': 'Victoria',
                    'male1': 'Alex',
                    'male2': 'Fred',
                    'robot': 'Zarvox'
                };

                const voices = speechSynthesis.getVoices();
                const voiceName = voiceMap[voiceSelect.value];
                if (voiceName) {
                    const voice = voices.find(v => v.name === voiceName);
                    if (voice) utterance.voice = voice;
                }

                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.volume = volumeSlider.value / 100;

                utterance.onstart = () => {
                    statusText.textContent = '🔊 Speaking...';
                };

                utterance.onend = () => {
                    statusText.textContent = '✅ Speech generated!';
                    // Add to transcript
                    transcripts.push({
                        text: '🎙️ ' + text.slice(0, 50) + (text.length > 50 ? '...' : ''),
                        time: new Date(),
                        id: Date.now()
                    });
                    renderTranscripts();
                };

                utterance.onerror = () => {
                    statusText.textContent = '❌ Speech generation error';
                };

                speechSynthesis.speak(utterance);

                // Simulate audio generation for waveform
                setTimeout(() => {
                    drawStaticWaveform();
                }, 500);
            }

            // ---------- Event Listeners ----------
            recordBtn.addEventListener('click', startRecording);
            stopBtn.addEventListener('click', stopRecording);
            playbackBtn.addEventListener('click', togglePlayback);
            exportBtn.addEventListener('click', exportAudio);
            clearBtn.addEventListener('click', clearAll);
            playBtn.addEventListener('click', togglePlayback);
            rewindBtn.addEventListener('click', () => {
                if (audioElement) audioElement.currentTime = Math.max(0, audioElement.currentTime - 5);
            });
            forwardBtn.addEventListener('click', () => {
                if (audioElement) audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime +
                5);
            });
            progressBar.addEventListener('click', seekTo);
            volumeSlider.addEventListener('input', (e) => {
                const volume = e.target.value / 100;
                if (audioElement) audioElement.volume = volume;
            });
            ttsBtn.addEventListener('click', generateSpeech);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePlayback();
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!isRecording) startRecording();
                    else stopRecording();
                }
                if (e.key === 't' || e.key === 'T') {
                    document.getElementById('ttsText').focus();
                }
            });

            // Load voices
            speechSynthesis.onvoiceschanged = () => {
                speechSynthesis.getVoices();
            };

            // ---------- Init ----------
            drawStaticWaveform();
            statusText.textContent = '🎙️ AI Podcast Studio ready! Click "Record" to start.';

            console.log('🎙️ AI Podcast Studio loaded!');
            console.log('💡 Tips:');
            console.log('  - Click Record to start recording');
            console.log('  - Use the AI Voice Synthesis to generate speech');
            console.log('  - Transcripts are automatically generated');
            console.log('  - Keyboard shortcuts: Space=play/pause, R=record/stop, T=focus text');
            console.log('  - Export your audio as a file');

        })();
    </script>
</body>
</html>
