<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💰 Crypto Portfolio Tracker</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            min-height: 100vh;
            transition: 0.3s;
        }
        body.light {
            background: #f0f4ff;
            color: #1a1a2e;
        }
        body.light .container {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.06);
        }
        body.light .sidebar {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.06);
        }
        body.light .stat-card,
        body.light .coin-item,
        body.light .news-item {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 0, 0, 0.04);
        }
        body.light .coin-item:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        body.light input,
        body.light select {
            background: rgba(255, 255, 255, 0.8);
            color: #1a1a2e;
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light .modal-content {
            background: #ffffff;
        }
        body.light .price-up {
            color: #00b894;
        }
        body.light .price-down {
            color: #e17055;
        }
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
            transition: 0.3s;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: 700;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .sidebar-header span {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-toggle {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 0.2rem 0.6rem;
            color: #8899c7;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.1s;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .total-value {
            background: rgba(108, 92, 231, 0.15);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            margin: 0.6rem 0;
            border: 1px solid rgba(108, 92, 231, 0.1);
        }
        .total-value .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899c7;
        }
        .total-value .amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f0f4ff;
        }
        .total-value .change {
            font-size: 0.9rem;
            margin-left: 0.6rem;
        }
        .price-up {
            color: #00b894;
        }
        .price-down {
            color: #e17055;
        }
        /* Add coin form */
        .add-coin-form {
            display: flex;
            gap: 0.4rem;
            margin: 0.4rem 0 0.6rem;
            flex-wrap: wrap;
        }
        .add-coin-form input,
        .add-coin-form select {
            flex: 1;
            padding: 0.5rem 0.8rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.85rem;
            outline: none;
            min-width: 80px;
            transition: 0.15s;
        }
        .add-coin-form input:focus,
        .add-coin-form select:focus {
            border-color: #6c5ce7;
        }
        .add-coin-form button {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 30px;
            background: #6c5ce7;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            white-space: nowrap;
        }
        .add-coin-form button:hover {
            background: #7d6ff0;
            transform: scale(1.02);
        }
        .add-coin-form button:active {
            transform: scale(0.95);
        }
        /* Portfolio list */
        .portfolio-list {
            flex: 1;
            overflow-y: auto;
            margin: 0.4rem 0;
        }
        .portfolio-list::-webkit-scrollbar {
            width: 3px;
        }
        .portfolio-list::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .coin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            margin-bottom: 0.3rem;
            transition: 0.1s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .coin-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(108, 92, 231, 0.2);
        }
        .coin-item.selected {
            border-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.1);
        }
        .coin-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 0;
        }
        .coin-symbol {
            font-weight: 700;
            font-size: 0.9rem;
            color: #f0f4ff;
        }
        .coin-name {
            font-size: 0.75rem;
            color: #8899c7;
        }
        .coin-balance {
            text-align: right;
            font-size: 0.85rem;
        }
        .coin-balance .amount {
            font-weight: 600;
        }
        .coin-balance .value {
            font-size: 0.7rem;
            color: #8899c7;
        }
        .coin-balance .change {
            font-size: 0.7rem;
            font-weight: 600;
        }
        .delete-coin {
            background: none;
            border: none;
            color: #54668f;
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            border-radius: 12px;
            font-size: 0.8rem;
            transition: 0.1s;
            margin-left: 0.3rem;
        }
        .delete-coin:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .empty-state {
            color: #54668f;
            font-size: 0.85rem;
            text-align: center;
            padding: 1.5rem 0;
        }
        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1.2rem 1.5rem;
            gap: 1rem;
        }
        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8899c7;
        }
        .stat-card .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 0.2rem;
        }
        .stat-card .stat-sub {
            font-size: 0.75rem;
            color: #8899c7;
        }
        /* Chart area */
        .chart-container {
            flex: 1;
            min-height: 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1.5rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
            max-height: 320px;
        }
        .chart-controls {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .chart-controls button {
            padding: 0.2rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899c7;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .chart-controls button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .chart-controls button.active {
            background: rgba(108, 92, 231, 0.2);
            border-color: #6c5ce7;
            color: white;
        }
        body.light .chart-controls button.active {
            background: rgba(108, 92, 231, 0.15);
            color: #6c5ce7;
        }
        /* News section */
        .news-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 180px;
            overflow-y: auto;
        }
        .news-section::-webkit-scrollbar {
            width: 3px;
        }
        .news-section::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .news-section .news-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #8899c7;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .news-item {
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.3rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
        }
        .news-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-left-color: #6c5ce7;
        }
        .news-item .news-source {
            color: #8899c7;
            font-size: 0.65rem;
            margin-left: 0.4rem;
        }
        .news-item .news-time {
            color: #54668f;
            font-size: 0.65rem;
            float: right;
        }
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: rgba(20, 20, 40, 0.95);
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }
        .modal-content .close-modal {
            float: right;
            background: none;
            border: none;
            color: #54668f;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-content .close-modal:hover {
            color: white;
        }
        .modal-content .coin-detail {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .modal-content .coin-detail:last-child {
            border-bottom: none;
        }
        .modal-content .detail-label {
            color: #8899c7;
            font-size: 0.8rem;
        }
        .modal-content .detail-value {
            font-weight: 600;
            font-size: 1.1rem;
        }
        /* Alert */
        .alert-banner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #dce5ff;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 9998;
            display: none;
            animation: slideUp 0.3s ease;
        }
        .alert-banner.show {
            display: block;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .alert-banner .alert-title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .alert-banner .alert-msg {
            font-size: 0.85rem;
            color: #8899c7;
            margin-top: 0.2rem;
        }
        .alert-banner .alert-close {
            background: none;
            border: none;
            color: #54668f;
            float: right;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .alert-banner .alert-close:hover {
            color: white;
        }
        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 0.8rem;
            }
            .main-content {
                padding: 0.8rem;
                gap: 0.6rem;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-container {
                min-height: 200px;
            }
            .chart-container canvas {
                max-height: 180px;
            }
            .news-section {
                max-height: 120px;
            }
            .total-value .amount {
                font-size: 1.3rem;
            }
            .modal-content {
                padding: 1.2rem;
                margin: 1rem;
            }
        }
        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 0.4rem;
            }
            .stat-card .stat-value {
                font-size: 1rem;
            }
            .add-coin-form {
                flex-direction: column;
            }
            .add-coin-form input,
            .add-coin-form select {
                min-width: unset;
            }
        }
        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* Ticker animation */
        .ticker {
            overflow: hidden;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            margin: 0.2rem 0;
        }
        .ticker-content {
            display: inline-block;
            animation: tickerScroll 30s linear infinite;
        }
        .ticker-content span {
            margin-right: 2rem;
            font-size: 0.8rem;
            color: #8899c7;
        }
        .ticker-content .highlight {
            color: #f0f4ff;
            font-weight: 600;
        }
        @keyframes tickerScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>💰 CryptoTracker</span>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>

            <div class="total-value">
                <div class="label">Total Portfolio Value</div>
                <div>
                    <span class="amount" id="totalValue">$0.00</span>
                    <span class="change" id="totalChange">+0.00%</span>
                </div>
            </div>

            <div class="add-coin-form">
                <input type="text" id="coinSymbol" placeholder="Symbol (e.g. BTC)" maxlength="10" />
                <input type="number" id="coinAmount" placeholder="Amount" step="any" min="0" />
                <button id="addCoinBtn">+ Add</button>
            </div>

            <div style="display:flex;gap:0.4rem;margin-bottom:0.4rem;flex-wrap:wrap;">
                <button id="refreshBtn" style="flex:1;padding:0.3rem;border-radius:30px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#8899c7;cursor:pointer;font-size:0.75rem;">🔄 Refresh</button>
                <button id="exportBtn" style="flex:1;padding:0.3rem;border-radius:30px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#8899c7;cursor:pointer;font-size:0.75rem;">📥 Export CSV</button>
            </div>

            <div class="section-title" style="font-size:0.75rem;color:#54668f;text-transform:uppercase;letter-spacing:0.5px;margin:0.2rem 0;">
                Portfolio
                <span id="coinCount" style="font-weight:400;">0 coins</span>
            </div>

            <div class="portfolio-list" id="portfolioList">
                <div class="empty-state">No coins added yet.<br />Add your first crypto above!</div>
            </div>

            <div class="ticker" id="ticker">
                <div class="ticker-content" id="tickerContent">
                    <span>📊 Loading market data...</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Stats -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-label">24h Volume</div>
                    <div class="stat-value" id="volumeStat">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Gainer</div>
                    <div class="stat-value" id="gainerStat">-</div>
                    <div class="stat-sub" id="gainerChange">+0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Loser</div>
                    <div class="stat-value" id="loserStat">-</div>
                    <div class="stat-sub" id="loserChange">-0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Market Cap</div>
                    <div class="stat-value" id="marketCapStat">$0</div>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-container">
                <div class="chart-controls">
                    <button class="active" data-range="1">1D</button>
                    <button data-range="7">1W</button>
                    <button data-range="30">1M</button>
                    <button data-range="90">3M</button>
                    <button data-range="365">1Y</button>
                    <span style="flex:1;"></span>
                    <span style="font-size:0.7rem;color:#54668f;" id="chartCoinLabel">Select a coin</span>
                </div>
                <canvas id="priceChart"></canvas>
            </div>

            <!-- News -->
            <div class="news-section">
                <div class="news-title">
                    <span>📰 Latest Crypto News</span>
                    <span style="font-size:0.65rem;color:#54668f;" id="newsTime"></span>
                </div>
                <div id="newsList">
                    <div class="news-item" style="color:#54668f;text-align:center;">Loading news...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">✕</button>
            <h2 id="modalTitle">Coin Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Alert Banner -->
    <div class="alert-banner" id="alertBanner">
        <button class="alert-close" id="alertClose">✕</button>
        <div class="alert-title" id="alertTitle">🔔 Price Alert</div>
        <div class="alert-msg" id="alertMsg">Message</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- State ----------
            let portfolio = JSON.parse(localStorage.getItem('cryptoPortfolio')) || [];
            let prices = {};
            let marketData = {};
            let selectedCoin = null;
            let chartInstance = null;
            let chartRange = 1;
            let isDark = true;
            let alertTimer = null;

            // ---------- DOM refs ----------
            const portfolioList = document.getElementById('portfolioList');
            const totalValue = document.getElementById('totalValue');
            const totalChange = document.getElementById('totalChange');
            const coinSymbol = document.getElementById('coinSymbol');
            const coinAmount = document.getElementById('coinAmount');
            const addCoinBtn = document.getElementById('addCoinBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const exportBtn = document.getElementById('exportBtn');
            const themeToggle = document.getElementById('themeToggle');
            const coinCount = document.getElementById('coinCount');
            const volumeStat = document.getElementById('volumeStat');
            const gainerStat = document.getElementById('gainerStat');
            const gainerChange = document.getElementById('gainerChange');
            const loserStat = document.getElementById('loserStat');
            const loserChange = document.getElementById('loserChange');
            const marketCapStat = document.getElementById('marketCapStat');
            const chartCoinLabel = document.getElementById('chartCoinLabel');
            const newsList = document.getElementById('newsList');
            const newsTime = document.getElementById('newsTime');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const closeModal = document.getElementById('closeModal');
            const alertBanner = document.getElementById('alertBanner');
            const alertTitle = document.getElementById('alertTitle');
            const alertMsg = document.getElementById('alertMsg');
            const alertClose = document.getElementById('alertClose');
            const tickerContent = document.getElementById('tickerContent');

            const canvas = document.getElementById('priceChart');
            const ctx = canvas.getContext('2d');

            // ---------- API ----------
            const API_BASE = 'https://api.coingecko.com/api/v3';
            const CACHE_DURATION = 60000; // 1 minute

            let cache = {};

            async function fetchWithCache(url, key, ttl = CACHE_DURATION) {
                const now = Date.now();
                if (cache[key] && (now - cache[key].timestamp) < ttl) {
                    return cache[key].data;
                }
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    cache[key] = { data, timestamp: now };
                    return data;
                } catch (error) {
                    console.warn('API fetch failed:', error);
                    if (cache[key]) return cache[key].data;
                    throw error;
                }
            }

            async function fetchPrices(ids) {
                if (!ids.length) return {};
                const url =
                    `${API_BASE}/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true`;
                const data = await fetchWithCache(url, 'prices_' + ids.join('_'));
                return data;
            }

            async function fetchCoinList() {
                const url = `${API_BASE}/coins/list`;
                const data = await fetchWithCache(url, 'coinlist', 3600000); // 1 hour
                return data;
            }

            async function fetchMarketData() {
                const url =
                    `${API_BASE}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false&price_change_percentage=24h`;
                const data = await fetchWithCache(url, 'marketdata', CACHE_DURATION);
                return data;
            }

            async function fetchChartData(id, days) {
                const url = `${API_BASE}/coins/${id}/market_chart?vs_currency=usd&days=${days}`;
                const data = await fetchWithCache(url, `chart_${id}_${days}`, CACHE_DURATION);
                return data;
            }

            async function fetchNews() {
                // Using a free crypto news API (CryptoPanic)
                try {
                    const url = `https://cryptopanic.com/api/v1/posts/?auth_token=YOUR_API_KEY&public=true`;
                    // Fallback to a simpler endpoint
                    const response = await fetch(
                        'https://min-api.cryptocompare.com/data/v2/news/?lang=EN&feeds=cointelegraph,coindesk,decrypt'
                    );
                    if (!response.ok) throw new Error('News fetch failed');
                    const data = await response.json();
                    return data.Data || [];
                } catch (error) {
                    console.warn('News fetch failed, using fallback:', error);
                    return generateFallbackNews();
                }
            }

            function generateFallbackNews() {
                const headlines = [
                    'Bitcoin surges past $60,000 as institutional adoption grows',
                    'Ethereum developers announce major upgrade timeline',
                    'Crypto market cap reaches new all-time high',
                    'Regulatory clarity boosts investor confidence in digital assets',
                    'NFT market shows strong recovery with record sales',
                    'Major bank announces crypto custody services',
                    'Layer 2 solutions see massive adoption growth',
                    'DeFi protocols reach $100B in total value locked',
                    'Crypto payments gain traction among major retailers',
                    'New blockchain gaming platform raises $100M in funding'
                ];
                const sources = ['CoinTelegraph', 'CoinDesk', 'Decrypt', 'Bloomberg Crypto', 'Reuters'];
                return headlines.map((title, i) => ({
                    title: title,
                    source: sources[i % sources.length],
                    published_on: Date.now() - i * 3600000,
                    url: '#'
                }));
            }

            // ---------- Portfolio ----------
            function savePortfolio() {
                localStorage.setItem('cryptoPortfolio', JSON.stringify(portfolio));
                renderPortfolio();
                updateTotalValue();
            }

            function renderPortfolio() {
                if (portfolio.length === 0) {
                    portfolioList.innerHTML = '<div class="empty-state">No coins added yet.<br />Add your first crypto above!</div>';
                    coinCount.textContent = '0 coins';
                    return;
                }
                let html = '';
                let total = 0;
                portfolio.forEach((item, index) => {
                    const price = prices[item.symbol.toLowerCase()]?.usd || 0;
                    const change = prices[item.symbol.toLowerCase()]?.usd_24h_change || 0;
                    const value = price * item.amount;
                    total += value;
                    const changeClass = change >= 0 ? 'price-up' : 'price-down';
                    const changeArrow = change >= 0 ? '▲' : '▼';
                    html += `
                        <div class="coin-item ${selectedCoin === item.symbol.toLowerCase() ? 'selected' : ''}" 
                             data-symbol="${item.symbol}" data-index="${index}">
                            <div class="coin-info">
                                <span class="coin-symbol">${item.symbol.toUpperCase()}</span>
                                <span class="coin-name">${item.name || item.symbol.toUpperCase()}</span>
                            </div>
                            <div class="coin-balance">
                                <div class="amount">$${value.toFixed(2)}</div>
                                <div>
                                    <span class="value">${item.amount} ${item.symbol.toUpperCase()}</span>
                                    <span class="change ${changeClass}">${changeArrow} ${Math.abs(change).toFixed(2)}%</span>
                                </div>
                            </div>
                            <button class="delete-coin" data-index="${index}">✕</button>
                        </div>
                    `;
                });
                portfolioList.innerHTML = html;
                coinCount.textContent = `${portfolio.length} coins`;

                // Event listeners
                portfolioList.querySelectorAll('.coin-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.delete-coin')) return;
                        const symbol = this.dataset.symbol;
                        selectCoin(symbol);
                    });
                });

                portfolioList.querySelectorAll('.delete-coin').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = parseInt(this.dataset.index);
                        portfolio.splice(index, 1);
                        savePortfolio();
                        if (selectedCoin && !portfolio.some(p => p.symbol.toLowerCase() === selectedCoin)) {
                            selectCoin(null);
                        }
                        updateTotalValue();
                        showAlert('🗑️ Removed', 'Coin removed from portfolio');
                    });
                });
            }

            function updateTotalValue() {
                let total = 0;
                let weightedChange = 0;
                let hasData = false;
                portfolio.forEach(item => {
                    const price = prices[item.symbol.toLowerCase()]?.usd || 0;
                    const change = prices[item.symbol.toLowerCase()]?.usd_24h_change || 0;
                    const value = price * item.amount;
                    total += value;
                    if (value > 0) {
                        weightedChange += change * value;
                        hasData = true;
                    }
                });
                totalValue.textContent = `$${total.toFixed(2)}`;
                if (hasData && total > 0) {
                    const avgChange = weightedChange / total;
                    const changeClass = avgChange >= 0 ? 'price-up' : 'price-down';
                    totalChange.textContent = `${avgChange >= 0 ? '+' : ''}${avgChange.toFixed(2)}%`;
                    totalChange.className = `change ${changeClass}`;
                } else {
                    totalChange.textContent = '+0.00%';
                    totalChange.className = 'change price-up';
                }
            }

            // ---------- Select coin ----------
            async function selectCoin(symbol) {
                selectedCoin = symbol?.toLowerCase() || null;
                renderPortfolio();

                if (selectedCoin) {
                    const coin = portfolio.find(p => p.symbol.toLowerCase() === selectedCoin);
                    if (coin) {
                        chartCoinLabel.textContent = `${coin.symbol.toUpperCase()} / USD`;
                        await updateChart(selectedCoin, chartRange);
                    }
                } else {
                    chartCoinLabel.textContent = 'Select a coin';
                    if (chartInstance) {
                        chartInstance.destroy();
                        chartInstance = null;
                    }
                }
            }

            // ---------- Chart ----------
            async function updateChart(coinId, days) {
                try {
                    const data = await fetchChartData(coinId, days);
                    const prices = data.prices || [];
                    const labels = prices.map(p => {
                        const d = new Date(p[0]);
                        if (days <= 1) return d.toLocaleTimeString();
                        if (days <= 7) return d.toLocaleDateString();
                        return d.toLocaleDateString();
                    });
                    const values = prices.map(p => p[1]);

                    if (chartInstance) {
                        chartInstance.destroy();
                    }

                    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                    gradient.addColorStop(0, 'rgba(108, 92, 231, 0.3)');
                    gradient.addColorStop(1, 'rgba(108, 92, 231, 0.01)');

                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Price (USD)',
                                data: values,
                                borderColor: '#6c5ce7',
                                backgroundColor: gradient,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 0,
                                borderWidth: 2,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                    callbacks: {
                                        label: function(context) {
                                            return `$${context.parsed.y.toFixed(2)}`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: 'rgba(255,255,255,0.03)' },
                                    ticks: { color: '#8899c7', maxTicksLimit: 10 }
                                },
                                y: {
                                    grid: { color: 'rgba(255,255,255,0.03)' },
                                    ticks: {
                                        color: '#8899c7',
                                        callback: function(value) {
                                            return '$' + value.toFixed(2);
                                        }
                                    }
                                }
                            },
                            interaction: {
                                intersect: false,
                                mode: 'index'
                            }
                        }
                    });

                    // Update theme for chart
                    updateChartTheme();

                } catch (error) {
                    console.error('Chart update failed:', error);
                }
            }

            function updateChartTheme() {
                if (!chartInstance) return;
                const isLight = document.body.classList.contains('light');
                const color = isLight ? '#1a1a2e' : '#dce5ff';
                const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';
                chartInstance.options.scales.x.ticks.color = color;
                chartInstance.options.scales.y.ticks.color = color;
                chartInstance.options.scales.x.grid.color = gridColor;
                chartInstance.options.scales.y.grid.color = gridColor;
                chartInstance.update();
            }

            // ---------- Market Overview ----------
            async function updateMarketOverview() {
                try {
                    const data = await fetchMarketData();
                    marketData = data;

                    // Top gainer/loser
                    if (data.length > 0) {
                        const sorted = [...data].sort((a, b) => (b.price_change_percentage_24h || 0) - (a.price_change_percentage_24h ||
                            0));
                        const gainer = sorted[0];
                        const loser = sorted[sorted.length - 1];

                        gainerStat.textContent = gainer.symbol.toUpperCase();
                        gainerChange.textContent = `+${(gainer.price_change_percentage_24h || 0).toFixed(2)}%`;
                        gainerChange.className = 'stat-sub price-up';

                        loserStat.textContent = loser.symbol.toUpperCase();
                        loserChange.textContent = `${(loser.price_change_percentage_24h || 0).toFixed(2)}%`;
                        loserChange.className = 'stat-sub price-down';

                        // Total volume
                        const totalVol = data.reduce((sum, d) => sum + (d.total_volume || 0), 0);
                        volumeStat.textContent = formatCurrency(totalVol);

                        // Market cap
                        const totalMc = data.reduce((sum, d) => sum + (d.market_cap || 0), 0);
                        marketCapStat.textContent = formatCurrency(totalMc);

                        // Update ticker
                        updateTicker(data);
                    }

                    // Update coin prices in portfolio
                    await updatePrices();

                } catch (error) {
                    console.error('Market update failed:', error);
                }
            }

            function formatCurrency(value) {
                if (value >= 1e12) return `$${(value/1e12).toFixed(2)}T`;
                if (value >= 1e9) return `$${(value/1e9).toFixed(2)}B`;
                if (value >= 1e6) return `$${(value/1e6).toFixed(2)}M`;
                return `$${value.toFixed(2)}`;
            }

            // ---------- Update prices ----------
            async function updatePrices() {
                if (portfolio.length === 0) return;
                const ids = portfolio.map(p => p.symbol.toLowerCase());
                const data = await fetchPrices(ids);
                prices = data;
                renderPortfolio();
                updateTotalValue();
                checkPriceAlerts();
            }

            // ---------- Price alerts ----------
            function checkPriceAlerts() {
                // Simple alert: check if any coin moved more than 10% in 24h
                portfolio.forEach(item => {
                    const change = prices[item.symbol.toLowerCase()]?.usd_24h_change || 0;
                    if (Math.abs(change) > 10) {
                        const direction = change > 0 ? '🚀 up' : '📉 down';
                        showAlert(
                            `🔔 ${item.symbol.toUpperCase()} Alert`,
                            `${item.symbol.toUpperCase()} is ${direction} ${Math.abs(change).toFixed(2)}% in 24h!`
                        );
                    }
                });
            }

            // ---------- Ticker ----------
            function updateTicker(data) {
                if (!data || data.length === 0) return;
                let html = '';
                data.slice(0, 15).forEach(item => {
                    const change = item.price_change_percentage_24h || 0;
                    const cls = change >= 0 ? 'price-up' : 'price-down';
                    html += `
                        <span>
                            <span class="highlight">${item.symbol.toUpperCase()}</span>
                            $${item.current_price?.toFixed(2) || 0}
                            <span class="${cls}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</span>
                        </span>
                    `;
                });
                // Double for seamless loop
                tickerContent.innerHTML = html + html;
            }

            // ---------- News ----------
            async function loadNews() {
                try {
                    const news = await fetchNews();
                    if (!news || news.length === 0) {
                        newsList.innerHTML =
                        '<div class="news-item" style="color:#54668f;text-align:center;">No news available</div>';
                        return;
                    }
                    let html = '';
                    news.slice(0, 8).forEach(item => {
                        const time = new Date(item.published_on * 1000 || Date.now());
                        const timeStr = time.toLocaleDateString();
                        html += `
                            <div class="news-item" onclick="window.open('${item.url || '#'}', '_blank')">
                                ${item.title}
                                <span class="news-source">${item.source || 'Crypto News'}</span>
                                <span class="news-time">${timeStr}</span>
                            </div>
                        `;
                    });
                    newsList.innerHTML = html;
                    newsTime.textContent = `Updated ${new Date().toLocaleTimeString()}`;
                } catch (error) {
                    console.error('News load failed:', error);
                    newsList.innerHTML =
                    '<div class="news-item" style="color:#54668f;text-align:center;">Failed to load news</div>';
                }
            }

            // ---------- Alert ----------
            function showAlert(title, message) {
                alertTitle.textContent = title;
                alertMsg.textContent = message;
                alertBanner.classList.add('show');
                if (alertTimer) clearTimeout(alertTimer);
                alertTimer = setTimeout(() => {
                    alertBanner.classList.remove('show');
                }, 8000);
            }

            // ---------- Export CSV ----------
            function exportCSV() {
                if (portfolio.length === 0) {
                    showAlert('📤 Export', 'No data to export');
                    return;
                }
                let csv = 'Symbol,Name,Amount,Price (USD),Value (USD),24h Change (%)\n';
                portfolio.forEach(item => {
                    const price = prices[item.symbol.toLowerCase()]?.usd || 0;
                    const change = prices[item.symbol.toLowerCase()]?.usd_24h_change || 0;
                    const value = price * item.amount;
                    csv +=
                        `${item.symbol},${item.name || item.symbol},${item.amount},${price.toFixed(4)},${value.toFixed(2)},${change.toFixed(2)}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `portfolio_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showAlert('📥 Exported', 'Portfolio data exported as CSV!');
            }

            // ---------- Theme ----------
            function toggleTheme() {
                isDark = !isDark;
                document.body.classList.toggle('light', !isDark);
                themeToggle.textContent = isDark ? '🌙' : '☀️';
                updateChartTheme();
            }

            // ---------- Add coin ----------
            async function addCoin() {
                const symbol = coinSymbol.value.trim().toLowerCase();
                const amount = parseFloat(coinAmount.value);
                if (!symbol || isNaN(amount) || amount <= 0) {
                    showAlert('⚠️ Error', 'Please enter a valid symbol and amount');
                    return;
                }

                // Check if already exists
                if (portfolio.some(p => p.symbol.toLowerCase() === symbol)) {
                    showAlert('⚠️ Error', `${symbol.toUpperCase()} is already in your portfolio`);
                    return;
                }

                // Look up coin name
                try {
                    const coinList = await fetchCoinList();
                    const coin = coinList.find(c => c.symbol === symbol);
                    const name = coin ? coin.name : symbol.toUpperCase();

                    portfolio.push({
                        symbol: symbol,
                        name: name,
                        amount: amount,
                        added: new Date().toISOString()
                    });

                    savePortfolio();
                    coinSymbol.value = '';
                    coinAmount.value = '';
                    await updatePrices();
                    showAlert('✅ Added', `${name} (${symbol.toUpperCase()}) added to portfolio`);

                    // Auto-select the coin
                    selectCoin(symbol);

                } catch (error) {
                    console.error('Add coin failed:', error);
                    showAlert('⚠️ Error', 'Failed to add coin. Please try again.');
                }
            }

            // ---------- Refresh ----------
            async function refreshAll() {
                refreshBtn.innerHTML = '<span class="loading-spinner"></span>';
                refreshBtn.disabled = true;
                try {
                    await updateMarketOverview();
                    await loadNews();
                    if (selectedCoin) {
                        await updateChart(selectedCoin, chartRange);
                    }
                    showAlert('🔄 Refreshed', 'All data updated successfully!');
                } catch (error) {
                    console.error('Refresh failed:', error);
                    showAlert('⚠️ Error', 'Failed to refresh data');
                }
                refreshBtn.innerHTML = '🔄 Refresh';
                refreshBtn.disabled = false;
            }

            // ---------- Modal ----------
            function showCoinDetails(symbol) {
                const coin = portfolio.find(p => p.symbol.toLowerCase() === symbol.toLowerCase());
                if (!coin) return;
                const price = prices[coin.symbol.toLowerCase()]?.usd || 0;
                const change = prices[coin.symbol.toLowerCase()]?.usd_24h_change || 0;
                const vol = prices[coin.symbol.toLowerCase()]?.usd_24h_vol || 0;
                const mc = prices[coin.symbol.toLowerCase()]?.usd_market_cap || 0;
                const value = price * coin.amount;

                modalTitle.textContent = `${coin.symbol.toUpperCase()} Details`;
                modalBody.innerHTML = `
                    <div class="coin-detail">
                        <div class="detail-label">Name</div>
                        <div class="detail-value">${coin.name || coin.symbol.toUpperCase()}</div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">Amount</div>
                        <div class="detail-value">${coin.amount} ${coin.symbol.toUpperCase()}</div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">Current Price</div>
                        <div class="detail-value">$${price.toFixed(4)}</div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">Total Value</div>
                        <div class="detail-value">$${value.toFixed(2)}</div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">24h Change</div>
                        <div class="detail-value ${change >= 0 ? 'price-up' : 'price-down'}">
                            ${change >= 0 ? '+' : ''}${change.toFixed(2)}%
                        </div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">24h Volume</div>
                        <div class="detail-value">$${formatCurrency(vol)}</div>
                    </div>
                    <div class="coin-detail">
                        <div class="detail-label">Market Cap</div>
                        <div class="detail-value">$${formatCurrency(mc)}</div>
                    </div>
                `;
                modalOverlay.classList.add('show');
            }

            // ---------- Event listeners ----------
            addCoinBtn.addEventListener('click', addCoin);
            coinSymbol.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCoin(); });
            coinAmount.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCoin(); });

            refreshBtn.addEventListener('click', refreshAll);
            exportBtn.addEventListener('click', exportCSV);
            themeToggle.addEventListener('click', toggleTheme);

            document.querySelectorAll('.chart-controls button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.chart-controls button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    chartRange = parseInt(this.dataset.range);
                    if (selectedCoin) {
                        updateChart(selectedCoin, chartRange);
                    }
                });
            });

            closeModal.addEventListener('click', () => {
                modalOverlay.classList.remove('show');
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('show');
            });

            alertClose.addEventListener('click', () => {
                alertBanner.classList.remove('show');
                if (alertTimer) clearTimeout(alertTimer);
            });

            // Click on coin item to show details (double click)
            portfolioList.addEventListener('dblclick', (e) => {
                const item = e.target.closest('.coin-item');
                if (item) {
                    const symbol = item.dataset.symbol;
                    showCoinDetails(symbol);
                }
            });

            // ---------- Init ----------
            async function init() {
                // Load dark theme by default
                document.body.classList.remove('light');
                themeToggle.textContent = '🌙';

                // Load data
                await updateMarketOverview();
                await loadNews();
                renderPortfolio();
                updateTotalValue();

                // Auto-select first coin if available
                if (portfolio.length > 0) {
                    selectCoin(portfolio[0].symbol);
                }

                // Auto-refresh every 60 seconds
                setInterval(() => {
                    updateMarketOverview();
                    loadNews();
                }, 60000);

                console.log('💰 CryptoTracker loaded!');
                console.log('💡 Tips:');
                console.log('  - Double-click a coin for details');
                console.log('  - Click a coin to view its chart');
                console.log('  - Price alerts trigger on >10% moves');
                console.log('  - Export your portfolio as CSV');
                console.log(`  - Tracking ${portfolio.length} coins`);
            }

            init();

        })();
    </script>
</body>
</html>
