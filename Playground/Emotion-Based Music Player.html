<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎭 Mood Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            min-height: 100vh;
            overflow: hidden;
            transition: background 1s ease;
        }
        body.mood-happy {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
        }
        body.mood-sad {
            background: linear-gradient(135deg, #2d3436, #636e72);
        }
        body.mood-angry {
            background: linear-gradient(135deg, #e17055, #d63031);
        }
        body.mood-surprised {
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
        }
        body.mood-neutral {
            background: linear-gradient(135deg, #2d3436, #00b894);
        }
        body.mood-fear {
            background: linear-gradient(135deg, #6c5ce7, #2d3436);
        }
        body.mood-disgust {
            background: linear-gradient(135deg, #00b894, #2d3436);
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            backdrop-filter: blur(2px);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
            transition: 0.3s;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 700;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar-header span {
            background: linear-gradient(135deg, #fd79a8, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mood-display {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 0.8rem 0;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }
        .mood-display .mood-emoji {
            font-size: 3.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .mood-display .mood-label {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 0.2rem;
        }
        .mood-display .mood-confidence {
            font-size: 0.8rem;
            color: #8899c7;
        }
        .mood-ring {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(108, 92, 231, 0.1), transparent);
            animation: spin 4s linear infinite;
            pointer-events: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .mood-override {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0.4rem 0 0.6rem;
        }
        .mood-override button {
            padding: 0.3rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899c7;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.1s;
        }
        .mood-override button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .mood-override button.active {
            background: rgba(108, 92, 231, 0.2);
            border-color: #6c5ce7;
            color: white;
        }

        .camera-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: #54668f;
            padding: 0.3rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            margin-bottom: 0.4rem;
        }
        .camera-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .camera-status .dot.active {
            background: #00b894;
            animation: blink 1s ease-in-out infinite;
        }
        .camera-status .dot.inactive {
            background: #e17055;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .playlist-section {
            flex: 1;
            margin: 0.4rem 0;
            overflow-y: auto;
        }
        .playlist-section::-webkit-scrollbar {
            width: 3px;
        }
        .playlist-section::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #54668f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.7rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            margin-bottom: 0.3rem;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
        }
        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .track-item.active {
            border-left-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.1);
        }
        .track-item .track-number {
            font-size: 0.7rem;
            color: #54668f;
            min-width: 20px;
        }
        .track-item .track-info {
            flex: 1;
            min-width: 0;
        }
        .track-item .track-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-item .track-artist {
            font-size: 0.7rem;
            color: #8899c7;
        }
        .track-item .track-duration {
            font-size: 0.7rem;
            color: #54668f;
        }
        .track-item .track-mood {
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #8899c7;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1.5rem;
            gap: 1rem;
            position: relative;
        }

        /* Visualizer */
        .visualizer-container {
            flex: 1;
            min-height: 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .visualizer-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .visualizer-overlay {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        .visualizer-overlay .now-playing {
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .visualizer-overlay .now-playing-artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Controls */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #dce5ff;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 50%;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.05);
        }
        .player-controls button:active {
            transform: scale(0.9);
        }
        .player-controls .play-btn {
            font-size: 2rem;
            color: #6c5ce7;
        }
        .player-controls .play-btn:hover {
            color: #7d6ff0;
        }
        .player-controls .progress-container {
            flex: 1;
            min-width: 100px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .player-controls .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }
        .player-controls .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #fd79a8);
            border-radius: 10px;
            width: 0%;
            transition: 0.1s;
        }
        .player-controls .time-display {
            font-size: 0.75rem;
            color: #8899c7;
            min-width: 60px;
            text-align: center;
        }
        .player-controls .volume-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .player-controls .volume-control input[type="range"] {
            width: 60px;
            accent-color: #6c5ce7;
            background: transparent;
            cursor: pointer;
        }

        .voice-control {
            font-size: 0.7rem;
            color: #54668f;
            text-align: center;
            margin-top: 0.2rem;
        }
        .voice-control .voice-indicator {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.1s;
        }
        .voice-control .voice-indicator:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .voice-control .voice-indicator.listening {
            border-color: #6c5ce7;
            animation: pulse-border 1s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: #6c5ce7;
            }
            50% {
                border-color: #fd79a8;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 0.8rem;
            }
            .main-content {
                padding: 0.8rem;
                gap: 0.6rem;
            }
            .player-controls {
                padding: 0.5rem 0.8rem;
                gap: 0.5rem;
            }
            .player-controls .volume-control input[type="range"] {
                width: 40px;
            }
            .visualizer-overlay .now-playing {
                font-size: 0.9rem;
            }
            .mood-display .mood-emoji {
                font-size: 2.5rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }

        /* Glass effect for components */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Mood emoji animations */
        .mood-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* Shimmer effect for active track */
        .shimmer {
            background: linear-gradient(90deg, rgba(108, 92, 231, 0.1), rgba(108, 92, 231, 0.2), rgba(108, 92, 231, 0.1));
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                🎭 <span>Mood Music</span>
            </div>

            <div class="camera-status">
                <span class="dot" id="cameraDot"></span>
                <span id="cameraStatus">Camera: Initializing...</span>
            </div>

            <div class="mood-display" id="moodDisplay">
                <div class="mood-ring"></div>
                <div class="mood-emoji mood-float" id="moodEmoji">😐</div>
                <div class="mood-label" id="moodLabel">Neutral</div>
                <div class="mood-confidence" id="moodConfidence">Confidence: 0%</div>
            </div>

            <div class="mood-override">
                <button data-mood="happy">😊 Happy</button>
                <button data-mood="sad">😢 Sad</button>
                <button data-mood="angry">😠 Angry</button>
                <button data-mood="surprised">😲 Surprised</button>
                <button data-mood="neutral">😐 Neutral</button>
            </div>

            <div class="playlist-section">
                <div class="playlist-header">
                    <span>🎵 Playlist</span>
                    <span id="trackCount">0 tracks</span>
                </div>
                <div id="playlistContainer"></div>
            </div>

            <div class="voice-control">
                <span class="voice-indicator" id="voiceIndicator">🎤 Voice Commands</span>
                <span style="font-size:0.6rem;color:#54668f;margin-left:0.4rem;">"play", "pause", "next", "skip"</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="visualizer-container">
                <canvas id="visualizerCanvas"></canvas>
                <div class="visualizer-overlay">
                    <div class="now-playing" id="nowPlaying">No track playing</div>
                    <div class="now-playing-artist" id="nowPlayingArtist">Select a track or let your mood decide</div>
                </div>
            </div>

            <div class="player-controls">
                <button id="shuffleBtn" title="Shuffle">🔀</button>
                <button id="prevBtn">⏮️</button>
                <button class="play-btn" id="playBtn">▶️</button>
                <button id="nextBtn">⏭️</button>
                <button id="repeatBtn" title="Repeat">🔁</button>

                <div class="progress-container">
                    <span class="time-display" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time-display" id="totalTime">0:00</span>
                </div>

                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="70" />
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- Music Library ----------
            const MUSIC_LIBRARY = [{
                id: 1,
                title: "Happy Days",
                artist: "Sunshine Band",
                mood: "happy",
                duration: 185,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                color: "#fdcb6e"
            }, {
                id: 2,
                title: "Sunny Side Up",
                artist: "The Optimists",
                mood: "happy",
                duration: 200,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                color: "#fdcb6e"
            }, {
                id: 3,
                title: "Melancholy Rain",
                artist: "Solo Piano",
                mood: "sad",
                duration: 210,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                color: "#636e72"
            }, {
                id: 4,
                title: "Heartbreak Avenue",
                artist: "The Blues",
                mood: "sad",
                duration: 195,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                color: "#636e72"
            }, {
                id: 5,
                title: "Rage Against",
                artist: "Metal Core",
                mood: "angry",
                duration: 220,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                color: "#e17055"
            }, {
                id: 6,
                title: "Fury Storm",
                artist: "Thunder Drums",
                mood: "angry",
                duration: 188,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
                color: "#e17055"
            }, {
                id: 7,
                title: "Electric Surprise",
                artist: "Neon Pulse",
                mood: "surprised",
                duration: 175,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
                color: "#6c5ce7"
            }, {
                id: 8,
                title: "Unexpected Twist",
                artist: "Mystery Band",
                mood: "surprised",
                duration: 190,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
                color: "#6c5ce7"
            }, {
                id: 9,
                title: "Chill Vibes",
                artist: "Lo-Fi Dreams",
                mood: "neutral",
                duration: 205,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3",
                color: "#00b894"
            }, {
                id: 10,
                title: "Ambient Waves",
                artist: "Electronic Sound",
                mood: "neutral",
                duration: 230,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3",
                color: "#00b894"
            }, {
                id: 11,
                title: "Fear Factor",
                artist: "Dark Orchestra",
                mood: "fear",
                duration: 215,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                color: "#6c5ce7"
            }, {
                id: 12,
                title: "Night Terrors",
                artist: "Shadow Sounds",
                mood: "fear",
                duration: 198,
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                color: "#6c5ce7"
            }];

            // ---------- State ----------
            let currentMood = 'neutral';
            let moodConfidence = 0;
            let currentTrackIndex = 0;
            let isPlaying = false;
            let isShuffled = false;
            let isRepeating = false;
            let volume = 0.7;
            let playlist = [];
            let currentPlaylist = [];
            let audioContext = null;
            let audioElement = null;
            let analyser = null;
            let dataArray = null;
            let animationId = null;
            let isVoiceListening = false;
            let recognition = null;
            let moodOverride = false;

            // ---------- DOM refs ----------
            const canvas = document.getElementById('visualizerCanvas');
            const ctx = canvas.getContext('2d');
            const playlistContainer = document.getElementById('playlistContainer');
            const trackCount = document.getElementById('trackCount');
            const moodEmoji = document.getElementById('moodEmoji');
            const moodLabel = document.getElementById('moodLabel');
            const moodConfidenceEl = document.getElementById('moodConfidence');
            const nowPlaying = document.getElementById('nowPlaying');
            const nowPlayingArtist = document.getElementById('nowPlayingArtist');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const repeatBtn = document.getElementById('repeatBtn');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const currentTime = document.getElementById('currentTime');
            const totalTime = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const cameraDot = document.getElementById('cameraDot');
            const cameraStatus = document.getElementById('cameraStatus');
            const voiceIndicator = document.getElementById('voiceIndicator');
            const moodDisplay = document.getElementById('moodDisplay');

            // ---------- Canvas setup ----------
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = canvas.clientWidth || rect.width || 800;
                canvas.height = canvas.clientHeight || 400;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            // ---------- Audio Setup ----------
            function initAudio() {
                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.8;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
            }

            function loadTrack(index) {
                const track = currentPlaylist[index];
                if (!track) return;

                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                }

                audioElement = new Audio(track.url);
                audioElement.crossOrigin = 'anonymous';

                // Connect to analyser
                const source = audioContext.createMediaElementSource(audioElement);
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                audioElement.volume = volume;
                audioElement.load();

                audioElement.addEventListener('loadedmetadata', () => {
                    totalTime.textContent = formatTime(audioElement.duration);
                });

                audioElement.addEventListener('timeupdate', () => {
                    updateProgress();
                });

                audioElement.addEventListener('ended', () => {
                    if (isRepeating) {
                        playTrack(index);
                    } else {
                        nextTrack();
                    }
                });

                currentTrackIndex = index;
                nowPlaying.textContent = track.title;
                nowPlayingArtist.textContent = track.artist;

                // Update playlist UI
                renderPlaylist();

                // Set body mood color
                setMoodTheme(track.mood);

                if (isPlaying) {
                    audioElement.play();
                }

                updateVisualization();
            }

            function playTrack(index) {
                if (index >= currentPlaylist.length) {
                    if (isShuffled) {
                        shufflePlaylist();
                        index = 0;
                    } else {
                        index = 0;
                    }
                }
                loadTrack(index);
                isPlaying = true;
                playBtn.textContent = '⏸️';
            }

            function togglePlay() {
                initAudio();
                if (!audioElement || !audioElement.src) {
                    if (currentPlaylist.length === 0) {
                        generatePlaylist();
                    }
                    playTrack(0);
                    return;
                }

                if (isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶️';
                } else {
                    audioElement.play();
                    isPlaying = true;
                    playBtn.textContent = '⏸️';
                }
            }

            function nextTrack() {
                if (currentPlaylist.length === 0) return;
                let nextIndex = currentTrackIndex + 1;
                if (nextIndex >= currentPlaylist.length) {
                    if (isShuffled) {
                        shufflePlaylist();
                        nextIndex = 0;
                    } else {
                        nextIndex = 0;
                    }
                }
                playTrack(nextIndex);
            }

            function prevTrack() {
                if (currentPlaylist.length === 0) return;
                let prevIndex = currentTrackIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = currentPlaylist.length - 1;
                }
                playTrack(prevIndex);
            }

            function updateProgress() {
                if (!audioElement) return;
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                progressFill.style.width = progress + '%';
                currentTime.textContent = formatTime(audioElement.currentTime);
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${String(secs).padStart(2, '0')}`;
            }

            // ---------- Playlist ----------
            function generatePlaylist() {
                const moodTracks = MUSIC_LIBRARY.filter(t => t.mood === currentMood);
                if (moodTracks.length === 0) {
                    currentPlaylist = [...MUSIC_LIBRARY];
                } else {
                    currentPlaylist = [...moodTracks];
                }
                if (isShuffled) shufflePlaylist();
                renderPlaylist();
                trackCount.textContent = `${currentPlaylist.length} tracks`;
            }

            function shufflePlaylist() {
                for (let i = currentPlaylist.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentPlaylist[i], currentPlaylist[j]] = [currentPlaylist[j], currentPlaylist[i]];
                }
                renderPlaylist();
            }

            function renderPlaylist() {
                if (currentPlaylist.length === 0) {
                    playlistContainer.innerHTML = `
                        <div style="text-align:center;color:#54668f;padding:1rem 0;font-size:0.85rem;">
                            No tracks available<br>
                            <span style="font-size:0.7rem;">Click a mood override to generate a playlist</span>
                        </div>
                    `;
                    return;
                }

                let html = '';
                currentPlaylist.forEach((track, index) => {
                    const isActive = index === currentTrackIndex && audioElement && audioElement.src;
                    const moodEmoji = {
                        happy: '😊',
                        sad: '😢',
                        angry: '😠',
                        surprised: '😲',
                        neutral: '😐',
                        fear: '😨',
                        disgust: '🤢'
                    } [track.mood] || '🎵';

                    html += `
                        <div class="track-item ${isActive ? 'active' : ''}" data-index="${index}">
                            <span class="track-number">${index + 1}</span>
                            <div class="track-info">
                                <div class="track-title">${track.title}</div>
                                <div class="track-artist">${track.artist}</div>
                            </div>
                            <span class="track-mood">${moodEmoji}</span>
                            <span class="track-duration">${formatTime(track.duration)}</span>
                        </div>
                    `;
                });
                playlistContainer.innerHTML = html;

                // Click to play
                playlistContainer.querySelectorAll('.track-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        if (index === currentTrackIndex && isPlaying) {
                            togglePlay();
                        } else {
                            playTrack(index);
                        }
                    });
                });
            }

            // ---------- Mood Detection (simulated) ----------
            // In a real implementation, you'd use Face-API.js or TensorFlow.js
            // This is a simulation with random mood changes for demo purposes
            let moodInterval = null;

            function startMoodDetection() {
                cameraDot.className = 'dot active';
                cameraStatus.textContent = 'Camera: Active (simulated)';

                // Simulate mood changes every 8-12 seconds
                moodInterval = setInterval(() => {
                    if (moodOverride) return;

                    const moods = ['happy', 'sad', 'angry', 'surprised', 'neutral', 'fear'];
                    const weights = [25, 15, 10, 20, 25, 5];
                    let total = weights.reduce((a, b) => a + b, 0);
                    let rand = Math.random() * total;
                    let selected = 'neutral';
                    for (let i = 0; i < weights.length; i++) {
                        rand -= weights[i];
                        if (rand <= 0) {
                            selected = moods[i];
                            break;
                        }
                    }

                    const confidence = Math.floor(Math.random() * 30 + 70);
                    updateMood(selected, confidence);

                    // Auto-generate playlist on mood change
                    if (!moodOverride) {
                        generatePlaylist();
                        if (!isPlaying && currentPlaylist.length > 0) {
                            // Auto-play first track
                            playTrack(0);
                        }
                    }
                }, 8000 + Math.random() * 4000);

                // Initial mood
                setTimeout(() => {
                    updateMood('neutral', 85);
                    generatePlaylist();
                    if (currentPlaylist.length > 0) {
                        playTrack(0);
                    }
                }, 500);
            }

            function updateMood(mood, confidence) {
                currentMood = mood;
                moodConfidence = confidence;

                const moodData = {
                    happy: { emoji: '😊', label: 'Happy', color: '#fdcb6e' },
                    sad: { emoji: '😢', label: 'Sad', color: '#636e72' },
                    angry: { emoji: '😠', label: 'Angry', color: '#e17055' },
                    surprised: { emoji: '😲', label: 'Surprised', color: '#6c5ce7' },
                    neutral: { emoji: '😐', label: 'Neutral', color: '#00b894' },
                    fear: { emoji: '😨', label: 'Fear', color: '#6c5ce7' },
                    disgust: { emoji: '🤢', label: 'Disgust', color: '#00b894' }
                };

                const data = moodData[mood] || moodData.neutral;
                moodEmoji.textContent = data.emoji;
                moodLabel.textContent = data.label;
                moodConfidenceEl.textContent = `Confidence: ${confidence}%`;

                // Update body color
                setMoodTheme(mood);

                // Update mood ring color
                document.querySelector('.mood-ring').style.background =
                    `conic-gradient(from 0deg, ${data.color}33, ${data.color}11, transparent)`;
            }

            function setMoodTheme(mood) {
                document.body.className = 'mood-' + mood;
            }

            // ---------- Voice Commands ----------
            function initVoiceCommands() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    voiceIndicator.textContent = '🎤 Voice not supported';
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const last = event.results.length - 1;
                    const transcript = event.results[last][0].transcript.toLowerCase().trim();
                    console.log('Voice command:', transcript);

                    if (transcript.includes('play')) {
                        if (!isPlaying) togglePlay();
                        voiceFeedback('Playing');
                    } else if (transcript.includes('pause') || transcript.includes('stop')) {
                        if (isPlaying) togglePlay();
                        voiceFeedback('Paused');
                    } else if (transcript.includes('next') || transcript.includes('skip')) {
                        nextTrack();
                        voiceFeedback('Next track');
                    } else if (transcript.includes('previous') || transcript.includes('back')) {
                        prevTrack();
                        voiceFeedback('Previous track');
                    } else if (transcript.includes('shuffle')) {
                        isShuffled = !isShuffled;
                        shuffleBtn.style.color = isShuffled ? '#6c5ce7' : '#dce5ff';
                        if (isShuffled) shufflePlaylist();
                        voiceFeedback(isShuffled ? 'Shuffle on' : 'Shuffle off');
                    } else if (transcript.includes('repeat')) {
                        isRepeating = !isRepeating;
                        repeatBtn.style.color = isRepeating ? '#6c5ce7' : '#dce5ff';
                        voiceFeedback(isRepeating ? 'Repeat on' : 'Repeat off');
                    } else if (transcript.includes('volume up')) {
                        volume = Math.min(1, volume + 0.1);
                        volumeSlider.value = volume * 100;
                        if (audioElement) audioElement.volume = volume;
                        voiceFeedback(`Volume ${Math.round(volume * 100)}%`);
                    } else if (transcript.includes('volume down')) {
                        volume = Math.max(0, volume - 0.1);
                        volumeSlider.value = volume * 100;
                        if (audioElement) audioElement.volume = volume;
                        voiceFeedback(`Volume ${Math.round(volume * 100)}%`);
                    } else if (transcript.includes('mood') || transcript.includes('feeling')) {
                        // Try to detect mood from voice
                        const moodKeywords = {
                            happy: ['happy', 'good', 'great', 'awesome', 'wonderful'],
                            sad: ['sad', 'depressed', 'lonely', 'cry', 'upset'],
                            angry: ['angry', 'mad', 'frustrated', 'annoyed', 'rage'],
                            surprised: ['surprised', 'wow', 'amazing', 'shock', 'unexpected']
                        };
                        let detectedMood = null;
                        for (const [mood, keywords] of Object.entries(moodKeywords)) {
                            if (keywords.some(k => transcript.includes(k))) {
                                detectedMood = mood;
                                break;
                            }
                        }
                        if (detectedMood) {
                            moodOverride = true;
                            updateMood(detectedMood, 90);
                            generatePlaylist();
                            if (currentPlaylist.length > 0) playTrack(0);
                            voiceFeedback(`Mood set to ${detectedMood}`);
                            // Reset override after 30 seconds
                            setTimeout(() => { moodOverride = false; }, 30000);
                        } else {
                            voiceFeedback('I didn\'t catch your mood');
                        }
                    }
                };

                recognition.onerror = (event) => {
                    console.warn('Voice recognition error:', event.error);
                    if (event.error === 'not-allowed') {
                        voiceIndicator.textContent = '🎤 Voice denied';
                    }
                };

                voiceIndicator.addEventListener('click', () => {
                    if (isVoiceListening) {
                        recognition.stop();
                        isVoiceListening = false;
                        voiceIndicator.classList.remove('listening');
                        voiceIndicator.textContent = '🎤 Voice Commands';
                    } else {
                        try {
                            recognition.start();
                            isVoiceListening = true;
                            voiceIndicator.classList.add('listening');
                            voiceIndicator.textContent = '🎤 Listening...';
                        } catch (e) {
                            console.warn('Voice start error:', e);
                        }
                    }
                });
            }

            function voiceFeedback(message) {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.rate = 0.9;
                    utterance.volume = 0.5;
                    speechSynthesis.speak(utterance);
                }
            }

            // ---------- Visualization ----------
            function updateVisualization() {
                if (!analyser) return;

                const width = canvas.width;
                const height = canvas.height;

                analyser.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, width, height);

                // Draw bars
                const barWidth = width / dataArray.length * 2;
                let x = 0;

                // Mood-based gradient
                const moodColors = {
                    happy: ['#fdcb6e', '#f39c12'],
                    sad: ['#636e72', '#2d3436'],
                    angry: ['#e17055', '#d63031'],
                    surprised: ['#6c5ce7', '#0984e3'],
                    neutral: ['#00b894', '#00cec9'],
                    fear: ['#6c5ce7', '#2d3436'],
                    disgust: ['#00b894', '#00b894']
                };
                const colors = moodColors[currentMood] || ['#6c5ce7', '#fd79a8'];

                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, colors[0]);
                gradient.addColorStop(1, colors[1]);

                for (let i = 0; i < dataArray.length; i++) {
                    const value = dataArray[i] / 255;
                    const barHeight = value * height * 0.9;

                    ctx.fillStyle = gradient;
                    ctx.shadowColor = colors[0];
                    ctx.shadowBlur = 10;
                    ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
                    ctx.shadowBlur = 0;

                    x += barWidth;
                }

                // Draw glow effect
                const glow = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 2);
                glow.addColorStop(0, `rgba(108, 92, 231, 0.05)`);
                glow.addColorStop(1, `rgba(108, 92, 231, 0)`);
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);

                if (isPlaying || audioElement?.paused === false) {
                    animationId = requestAnimationFrame(updateVisualization);
                } else {
                    // Draw static bars
                    setTimeout(() => {
                        if (!isPlaying) {
                            // Continue animation with zero data
                            animationId = requestAnimationFrame(updateVisualization);
                        }
                    }, 100);
                }
            }

            // ---------- Event Listeners ----------
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);

            shuffleBtn.addEventListener('click', () => {
                isShuffled = !isShuffled;
                shuffleBtn.style.color = isShuffled ? '#6c5ce7' : '#dce5ff';
                if (isShuffled) {
                    shufflePlaylist();
                    if (currentPlaylist.length > 0) {
                        playTrack(0);
                    }
                }
            });

            repeatBtn.addEventListener('click', () => {
                isRepeating = !isRepeating;
                repeatBtn.style.color = isRepeating ? '#6c5ce7' : '#dce5ff';
            });

            volumeSlider.addEventListener('input', (e) => {
                volume = e.target.value / 100;
                if (audioElement) audioElement.volume = volume;
            });

            progressBar.addEventListener('click', (e) => {
                if (!audioElement) return;
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioElement.currentTime = percent * audioElement.duration;
            });

            // Mood override buttons
            document.querySelectorAll('.mood-override button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const mood = this.dataset.mood;
                    moodOverride = true;
                    updateMood(mood, 95);
                    generatePlaylist();
                    if (currentPlaylist.length > 0) {
                        playTrack(0);
                    }
                    document.querySelectorAll('.mood-override button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // Reset override after 30 seconds
                    setTimeout(() => {
                        moodOverride = false;
                        document.querySelectorAll('.mood-override button').forEach(b => b.classList.remove(
                        'active'));
                    }, 30000);
                });
            });

            // ---------- Keyboard shortcuts ----------
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
                if (e.key === 'ArrowRight') nextTrack();
                if (e.key === 'ArrowLeft') prevTrack();
                if (e.key === 'v' || e.key === 'V') {
                    voiceIndicator.click();
                }
            });

            // ---------- Init ----------
            function init() {
                initAudio();
                startMoodDetection();
                initVoiceCommands();
                generatePlaylist();

                // Start visualization loop
                updateVisualization();

                console.log('🎭 Mood Music Player loaded!');
                console.log('💡 Tips:');
                console.log('  - Your mood is detected from the camera (simulated)');
                console.log('  - Click a mood button to override');
                console.log('  - Use voice commands: play, pause, next, skip, mood [happy/sad/angry]');
                console.log('  - Keyboard: Space=play/pause, Arrow keys=skip');
                console.log('  - Double-click a track to play it');
            }

            init();

        })();
    </script>
</body>
</html>
