<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🗺️ Map Explorer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            overflow-y: auto;
            z-index: 1000;
            color: #dce5ff;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: #f0f4ff;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar-header span {
            background: linear-gradient(135deg, #6c5ce7, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .search-box {
            display: flex;
            gap: 0.4rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.15s;
        }
        .search-box input:focus {
            border-color: #6c5ce7;
            background: rgba(255, 255, 255, 0.08);
        }
        .search-box input::placeholder {
            color: #54668f;
        }
        .search-box button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 40px;
            background: #6c5ce7;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            white-space: nowrap;
        }
        .search-box button:hover {
            background: #7d6ff0;
            transform: scale(1.02);
        }
        .search-box button:active {
            transform: scale(0.95);
        }
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #54668f;
            margin-top: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title button {
            background: none;
            border: none;
            color: #6c5ce7;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: 0.1s;
        }
        .section-title button:hover {
            background: rgba(108, 92, 231, 0.15);
        }
        .favorites-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .favorites-list::-webkit-scrollbar {
            width: 3px;
        }
        .favorites-list::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .fav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
        }
        .fav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-left-color: #6c5ce7;
        }
        .fav-item .fav-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .fav-item .fav-actions {
            display: flex;
            gap: 0.3rem;
        }
        .fav-item .fav-actions button {
            background: none;
            border: none;
            color: #54668f;
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            border-radius: 12px;
            font-size: 0.8rem;
            transition: 0.1s;
        }
        .fav-item .fav-actions button:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .fav-item .fav-actions button.go-btn:hover {
            color: #6bcbff;
            background: rgba(107, 203, 255, 0.1);
        }
        .empty-state {
            color: #54668f;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.8rem 0;
        }
        .info-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 0.2rem;
            flex-shrink: 0;
        }
        .info-panel .info-title {
            font-weight: 600;
            color: #f0f4ff;
            margin-bottom: 0.2rem;
        }
        .info-panel .info-detail {
            font-size: 0.85rem;
            color: #8899c7;
            word-wrap: break-word;
        }
        .info-panel .info-detail .weather {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.3rem;
            padding: 0.4rem 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
        }
        .tools-row {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .tools-row button {
            flex: 1;
            padding: 0.4rem 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899c7;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
            min-width: 60px;
        }
        .tools-row button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .tools-row button.active {
            background: rgba(108, 92, 231, 0.2);
            border-color: #6c5ce7;
            color: white;
        }
        .theme-toggle {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .theme-toggle button {
            padding: 0.3rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899c7;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .theme-toggle button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .theme-toggle button.active-theme {
            background: rgba(108, 92, 231, 0.2);
            border-color: #6c5ce7;
            color: white;
        }
        /* Map container */
        .map-container {
            flex: 1;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
            background: #0a0a1a;
        }
        /* Custom marker popup */
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(8px);
            color: #dce5ff;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(20, 20, 40, 0.95);
        }
        .custom-popup .leaflet-popup-content {
            font-size: 0.9rem;
            min-width: 180px;
        }
        .popup-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
        }
        .popup-actions button {
            padding: 0.2rem 0.8rem;
            border: none;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .popup-actions .fav-btn {
            background: rgba(108, 92, 231, 0.2);
            color: #6c5ce7;
        }
        .popup-actions .fav-btn:hover {
            background: rgba(108, 92, 231, 0.3);
        }
        .popup-actions .fav-btn.saved {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd93d;
        }
        .popup-actions .weather-btn {
            background: rgba(107, 203, 255, 0.15);
            color: #6bcbff;
        }
        .popup-actions .weather-btn:hover {
            background: rgba(107, 203, 255, 0.25);
        }
        /* Distance measurement overlay */
        .measure-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #dce5ff;
            font-size: 0.85rem;
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
        .measure-overlay.show {
            display: block;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 0.8rem;
                gap: 0.5rem;
            }
            .map-container {
                flex: 1;
                min-height: 55vh;
            }
            .favorites-list {
                max-height: 100px;
            }
            .sidebar-header {
                font-size: 1.1rem;
            }
            .info-panel {
                padding: 0.5rem 0.8rem;
            }
        }
        /* Leaflet overrides for dark theme */
        .leaflet-control-zoom {
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            background: rgba(20, 20, 40, 0.9) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-control-zoom a {
            color: #dce5ff !important;
            background: transparent !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(255, 255, 255, 0.05) !important;
        }
        .leaflet-control-attribution {
            background: rgba(10, 10, 26, 0.8) !important;
            color: #54668f !important;
            font-size: 0.7rem !important;
        }
        .leaflet-control-attribution a {
            color: #6c5ce7 !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                🗺️ <span>Map Explorer</span>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search location..." />
                <button id="searchBtn">🔍 Go</button>
            </div>

            <!-- Tools -->
            <div class="tools-row">
                <button id="locateBtn">📍 My Location</button>
                <button id="measureBtn" class="active">📏 Measure</button>
                <button id="clearMarkersBtn">🗑️ Clear</button>
            </div>

            <!-- Theme toggle -->
            <div class="theme-toggle">
                <span style="font-size:0.75rem;color:#54668f;">Map:</span>
                <button class="active-theme" data-theme="dark">🌙 Dark</button>
                <button data-theme="light">☀️ Light</button>
                <button data-theme="satellite">🛰️ Satellite</button>
            </div>

            <!-- Info panel -->
            <div class="info-panel" id="infoPanel">
                <div class="info-title">📍 Location Info</div>
                <div class="info-detail" id="infoDetail">
                    Click on the map to explore
                </div>
            </div>

            <!-- Favorites -->
            <div class="section-title">
                ⭐ Favorites
                <button id="exportFavsBtn">📤 Export</button>
            </div>
            <div class="favorites-list" id="favoritesList">
                <div class="empty-state">No favorites yet. Click a marker to save.</div>
            </div>

            <div style="font-size:0.7rem;color:#3e5279;text-align:center;margin-top:auto;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.03);">
                🏷️ Click map to add pin · Click pin for details
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
            <div class="measure-overlay" id="measureOverlay">
                📏 Click two points to measure distance
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- Init map ----------
            const map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                zoomControl: false,
                fadeAnimation: true,
                zoomAnimation: true,
            });

            // Tile layers
            const tileLayers = {
                dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                    subdomains: 'abcd',
                    maxZoom: 19
                }),
                light: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                    maxZoom: 19
                }),
                satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '&copy; <a href="https://www.esri.com/">Esri</a>',
                    maxZoom: 19
                })
            };

            let currentTheme = 'dark';
            tileLayers.dark.addTo(map);

            // Add zoom control to bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // ---------- State ----------
            const markers = []; // { marker, lat, lng, name, note }
            let favorites = JSON.parse(localStorage.getItem('mapFavorites')) || [];
            let selectedMarker = null;
            let measureMode = false;
            let measurePoints = [];
            let measureLine = null;
            let measureMarkers = [];
            let currentPopup = null;

            // ---------- DOM refs ----------
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const locateBtn = document.getElementById('locateBtn');
            const measureBtn = document.getElementById('measureBtn');
            const clearMarkersBtn = document.getElementById('clearMarkersBtn');
            const favoritesList = document.getElementById('favoritesList');
            const infoDetail = document.getElementById('infoDetail');
            const infoPanel = document.getElementById('infoPanel');
            const measureOverlay = document.getElementById('measureOverlay');
            const exportFavsBtn = document.getElementById('exportFavsBtn');

            // ---------- Helpers ----------
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
            }

            function formatDistance(meters) {
                if (meters < 1000) return Math.round(meters) + ' m';
                return (meters / 1000).toFixed(2) + ' km';
            }

            function getWeatherIcon(condition) {
                const icons = {
                    'clear': '☀️',
                    'clouds': '☁️',
                    'rain': '🌧️',
                    'snow': '❄️',
                    'thunderstorm': '⛈️',
                    'drizzle': '🌦️',
                    'mist': '🌫️',
                    'fog': '🌫️',
                    'haze': '🌫️',
                };
                const key = condition?.toLowerCase() || '';
                for (const [k, v] of Object.entries(icons)) {
                    if (key.includes(k)) return v;
                }
                return '🌤️';
            }

            // ---------- Favorites ----------
            function renderFavorites() {
                if (favorites.length === 0) {
                    favoritesList.innerHTML = '<div class="empty-state">No favorites yet. Click a marker to save.</div>';
                    return;
                }
                let html = '';
                favorites.forEach((fav, index) => {
                    html += `
                        <div class="fav-item" data-index="${index}">
                            <span class="fav-name">${fav.name || 'Unnamed'}</span>
                            <div class="fav-actions">
                                <button class="go-btn" data-action="go">📍</button>
                                <button data-action="delete">✕</button>
                            </div>
                        </div>
                    `;
                });
                favoritesList.innerHTML = html;

                // Event listeners for favorites
                favoritesList.querySelectorAll('.fav-item').forEach(item => {
                    const index = parseInt(item.dataset.index);
                    item.querySelector('[data-action="go"]')?.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const fav = favorites[index];
                        if (fav) {
                            map.setView([fav.lat, fav.lng], 14);
                            // Add a temporary highlight
                            L.circleMarker([fav.lat, fav.lng], {
                                radius: 10,
                                color: '#ffd93d',
                                fillColor: '#ffd93d',
                                fillOpacity: 0.3,
                                weight: 2,
                                className: 'highlight-marker'
                            }).addTo(map).bindPopup(`⭐ ${fav.name || 'Favorite'}`).openPopup();
                        }
                    });
                    item.querySelector('[data-action="delete"]')?.addEventListener('click', (e) => {
                        e.stopPropagation();
                        favorites.splice(index, 1);
                        localStorage.setItem('mapFavorites', JSON.stringify(favorites));
                        renderFavorites();
                    });
                });
            }

            function addFavorite(lat, lng, name) {
                // Check if already exists
                const exists = favorites.some(f => f.lat === lat && f.lng === lng);
                if (exists) {
                    showInfo('Already in favorites ⭐');
                    return false;
                }
                favorites.push({
                    id: generateId(),
                    lat: lat,
                    lng: lng,
                    name: name || 'Favorite location',
                    added: new Date().toISOString()
                });
                localStorage.setItem('mapFavorites', JSON.stringify(favorites));
                renderFavorites();
                showInfo('Added to favorites ⭐');
                return true;
            }

            // ---------- Info panel ----------
            function showInfo(message, isWeather = false) {
                infoDetail.innerHTML = message;
            }

            function showLocationInfo(lat, lng, name) {
                const coordStr = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                let html = `<strong>${name || '📍 Location'}</strong><br>`;
                html += `<span style="font-size:0.8rem;color:#8899c7;">${coordStr}</span>`;
                showInfo(html);
            }

            // ---------- Reverse geocoding ----------
            async function reverseGeocode(lat, lng) {
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`
                    );
                    const data = await response.json();
                    if (data && data.display_name) {
                        return data.display_name;
                    }
                    return null;
                } catch (error) {
                    console.warn('Reverse geocoding failed:', error);
                    return null;
                }
            }

            // ---------- Search ----------
            async function searchLocation(query) {
                if (!query.trim()) return;
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1`
                    );
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const result = data[0];
                        const lat = parseFloat(result.lat);
                        const lng = parseFloat(result.lon);
                        map.setView([lat, lng], 14);
                        // Add a temporary marker
                        const marker = L.marker([lat, lng], {
                            icon: L.divIcon({
                                className: 'search-marker',
                                html: '📍',
                                iconSize: [24, 24],
                                iconAnchor: [12, 24]
                            })
                        }).addTo(map);
                        marker.bindPopup(`🔍 ${result.display_name || 'Search result'}`).openPopup();
                        showLocationInfo(lat, lng, result.display_name || 'Search result');
                        // Auto-add to markers? No, let user click to add.
                        setTimeout(() => {
                            // Remove temporary marker after 10s? Keep it, user can manage.
                        }, 100);
                    } else {
                        showInfo('❌ No results found');
                    }
                } catch (error) {
                    console.error('Search failed:', error);
                    showInfo('❌ Search failed. Please try again.');
                }
            }

            // ---------- Weather ----------
            async function getWeather(lat, lng) {
                try {
                    // Using OpenWeatherMap free tier - you can replace with your API key
                    const apiKey = 'YOUR_API_KEY'; // Replace with your key or use free alternative
                    // Using wttr.in as free alternative (no API key needed)
                    const response = await fetch(
                        `https://wttr.in/${lat},${lng}?format=j1`
                    );
                    const data = await response.json();
                    if (data && data.current_condition) {
                        const current = data.current_condition[0];
                        const temp = current.temp_C;
                        const condition = current.weatherDesc[0].value;
                        const humidity = current.humidity;
                        const wind = current.windSpeedKmph;
                        const icon = getWeatherIcon(condition);
                        return {
                            temp: temp,
                            condition: condition,
                            humidity: humidity,
                            wind: wind,
                            icon: icon
                        };
                    }
                    return null;
                } catch (error) {
                    console.warn('Weather fetch failed:', error);
                    return null;
                }
            }

            // ---------- Create marker ----------
            async function createMarker(lat, lng, name = null) {
                // Reverse geocode if no name
                if (!name) {
                    const geoName = await reverseGeocode(lat, lng);
                    name = geoName || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }

                const marker = L.marker([lat, lng], {
                    draggable: true,
                    icon: L.divIcon({
                        className: 'custom-marker',
                        html: '📍',
                        iconSize: [28, 28],
                        iconAnchor: [14, 28]
                    })
                }).addTo(map);

                // Store marker data
                const markerData = {
                    marker: marker,
                    lat: lat,
                    lng: lng,
                    name: name,
                    id: generateId()
                };
                markers.push(markerData);

                // Popup
                const popupContent = `
                    <div style="min-width:180px;">
                        <strong>${name}</strong><br>
                        <span style="font-size:0.8rem;color:#8899c7;">${lat.toFixed(5)}, ${lng.toFixed(5)}</span>
                        <div class="popup-actions">
                            <button class="fav-btn" data-action="favorite">⭐ Save</button>
                            <button class="weather-btn" data-action="weather">🌤️ Weather</button>
                            <button class="fav-btn" data-action="delete-marker" style="color:#ff6b6b;">🗑️</button>
                        </div>
                    </div>
                `;

                const popup = L.popup({
                    className: 'custom-popup',
                    maxWidth: 280,
                    minWidth: 200
                }).setContent(popupContent);

                marker.bindPopup(popup);

                // Handle popup events
                marker.on('popupopen', function() {
                    const container = this.getPopup().getElement();
                    if (!container) return;

                    // Favorite button
                    const favBtn = container.querySelector('[data-action="favorite"]');
                    if (favBtn) {
                        const isFav = favorites.some(f => f.lat === lat && f.lng === lng);
                        if (isFav) favBtn.classList.add('saved');
                        favBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (isFav) {
                                // Remove from favorites
                                const index = favorites.findIndex(f => f.lat === lat && f.lng === lng);
                                if (index > -1) {
                                    favorites.splice(index, 1);
                                    localStorage.setItem('mapFavorites', JSON.stringify(favorites));
                                    renderFavorites();
                                    showInfo('Removed from favorites');
                                    favBtn.classList.remove('saved');
                                }
                            } else {
                                addFavorite(lat, lng, name);
                                favBtn.classList.add('saved');
                            }
                        });
                    }

                    // Weather button
                    const weatherBtn = container.querySelector('[data-action="weather"]');
                    if (weatherBtn) {
                        weatherBtn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            weatherBtn.textContent = '⏳ Loading...';
                            weatherBtn.disabled = true;
                            const weather = await getWeather(lat, lng);
                            if (weather) {
                                const weatherHtml = `
                                    <div class="weather">
                                        <span style="font-size:1.5rem;">${weather.icon}</span>
                                        <span>${weather.temp}°C</span>
                                        <span style="color:#8899c7;">${weather.condition}</span>
                                        <span style="font-size:0.7rem;color:#54668f;">💨${weather.wind}km/h</span>
                                    </div>
                                `;
                                showInfo(weatherHtml, true);
                            } else {
                                showInfo('❌ Weather unavailable');
                            }
                            weatherBtn.textContent = '🌤️ Weather';
                            weatherBtn.disabled = false;
                        });
                    }

                    // Delete marker button
                    const deleteBtn = container.querySelector('[data-action="delete-marker"]');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const index = markers.findIndex(m => m.id === markerData.id);
                            if (index > -1) {
                                map.removeLayer(markers[index].marker);
                                markers.splice(index, 1);
                                showInfo('🗑️ Marker removed');
                            }
                        });
                    }
                });

                marker.on('dragend', function(e) {
                    const newLat = e.target.getLatLng().lat;
                    const newLng = e.target.getLatLng().lng;
                    markerData.lat = newLat;
                    markerData.lng = newLng;
                    // Update name via reverse geocode
                    reverseGeocode(newLat, newLng).then(name => {
                        if (name) {
                            markerData.name = name;
                            // Update popup content? We'll just update info
                            showLocationInfo(newLat, newLng, name);
                        }
                    });
                });

                showLocationInfo(lat, lng, name);
                return markerData;
            }

            // ---------- Clear markers ----------
            function clearAllMarkers() {
                markers.forEach(m => {
                    map.removeLayer(m.marker);
                });
                markers.length = 0;
                showInfo('🗑️ All markers cleared');
                // Also clear measure
                clearMeasure();
            }

            // ---------- Measure tool ----------
            function clearMeasure() {
                if (measureLine) {
                    map.removeLayer(measureLine);
                    measureLine = null;
                }
                measureMarkers.forEach(m => map.removeLayer(m));
                measureMarkers = [];
                measurePoints = [];
                measureOverlay.classList.remove('show');
            }

            function toggleMeasure() {
                measureMode = !measureMode;
                measureBtn.classList.toggle('active');
                if (measureMode) {
                    measureOverlay.classList.add('show');
                    showInfo('📏 Click two points to measure distance');
                    clearMeasure();
                } else {
                    measureOverlay.classList.remove('show');
                    clearMeasure();
                    showInfo('📍 Click map to explore');
                }
            }

            function handleMeasureClick(e) {
                if (!measureMode) return;
                const latlng = e.latlng;
                measurePoints.push(latlng);

                // Add marker
                const marker = L.circleMarker(latlng, {
                    radius: 6,
                    color: '#6c5ce7',
                    fillColor: '#6c5ce7',
                    fillOpacity: 0.8,
                    weight: 2
                }).addTo(map);
                measureMarkers.push(marker);

                if (measurePoints.length === 2) {
                    // Calculate distance
                    const p1 = measurePoints[0];
                    const p2 = measurePoints[1];
                    const distance = p1.distanceTo(p2);
                    const midLat = (p1.lat + p2.lat) / 2;
                    const midLng = (p1.lng + p2.lng) / 2;

                    // Draw line
                    if (measureLine) map.removeLayer(measureLine);
                    measureLine = L.polyline([p1, p2], {
                        color: '#6c5ce7',
                        weight: 3,
                        dashArray: '6, 6',
                        opacity: 0.8
                    }).addTo(map);

                    // Show distance label
                    const label = L.marker([midLat, midLng], {
                        icon: L.divIcon({
                            className: 'distance-label',
                            html: `<div style="background:rgba(20,20,40,0.9);padding:0.3rem 0.8rem;border-radius:20px;border:1px solid rgba(255,255,255,0.06);color:white;font-size:0.8rem;backdrop-filter:blur(4px);">📏 ${formatDistance(distance)}</div>`,
                            iconSize: [0, 0],
                            iconAnchor: [0, 0]
                        })
                    }).addTo(map);
                    measureMarkers.push(label);

                    showInfo(`📏 Distance: ${formatDistance(distance)}`);
                    measureOverlay.classList.remove('show');
                    measureMode = false;
                    measureBtn.classList.remove('active');
                } else {
                    showInfo('📏 Click second point to measure');
                }
            }

            // ---------- Map click handler ----------
            map.on('click', async function(e) {
                if (measureMode) {
                    handleMeasureClick(e);
                    return;
                }
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                const name = await reverseGeocode(lat, lng);
                createMarker(lat, lng, name || '📍 Pin');
            });

            // ---------- Locate user ----------
            function locateUser() {
                if (!navigator.geolocation) {
                    showInfo('❌ Geolocation not supported');
                    return;
                }
                showInfo('📍 Locating...');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        map.setView([lat, lng], 15);
                        createMarker(lat, lng, '📍 My Location');
                        showInfo('📍 Location found!');
                    },
                    (err) => {
                        showInfo('❌ Location access denied');
                        console.warn('Geolocation error:', err);
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    }
                );
            }

            // ---------- Theme switching ----------
            function setTheme(theme) {
                // Remove all layers
                Object.values(tileLayers).forEach(layer => {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                });
                // Add selected
                if (tileLayers[theme]) {
                    tileLayers[theme].addTo(map);
                    currentTheme = theme;
                    // Update buttons
                    document.querySelectorAll('.theme-toggle button').forEach(btn => {
                        btn.classList.toggle('active-theme', btn.dataset.theme === theme);
                    });
                }
            }

            // ---------- Export favorites ----------
            function exportFavorites() {
                if (favorites.length === 0) {
                    showInfo('No favorites to export');
                    return;
                }
                const data = JSON.stringify(favorites, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `favorites_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showInfo('📤 Favorites exported!');
            }

            // ---------- Event listeners ----------
            searchBtn.addEventListener('click', () => {
                searchLocation(searchInput.value);
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchLocation(searchInput.value);
            });

            locateBtn.addEventListener('click', locateUser);
            measureBtn.addEventListener('click', toggleMeasure);
            clearMarkersBtn.addEventListener('click', clearAllMarkers);
            exportFavsBtn.addEventListener('click', exportFavorites);

            // Theme buttons
            document.querySelectorAll('.theme-toggle button').forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.dataset.theme);
                });
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'm' || e.key === 'M') {
                    toggleMeasure();
                }
                if (e.key === 'l' || e.key === 'L') {
                    locateUser();
                }
                if (e.key === 'c' || e.key === 'C') {
                    clearAllMarkers();
                }
                if (e.key === 'Escape') {
                    clearMeasure();
                    if (currentPopup) {
                        map.closePopup(currentPopup);
                        currentPopup = null;
                    }
                }
            });

            // ---------- Init ----------
            renderFavorites();
            showInfo('📍 Click on the map to add a pin');

            // Add some default markers for demo
            const demoLocations = [
                { lat: 48.8566, lng: 2.3522, name: '🗼 Paris, France' },
                { lat: 40.7128, lng: -74.0060, name: '🗽 New York, USA' },
                { lat: 35.6762, lng: 139.6503, name: '🗾 Tokyo, Japan' },
            ];
            // Add after a small delay
            setTimeout(() => {
                demoLocations.forEach((loc, i) => {
                    setTimeout(() => {
                        createMarker(loc.lat, loc.lng, loc.name);
                    }, i * 300);
                });
            }, 500);

            console.log('🗺️ Map Explorer loaded!');
            console.log('💡 Tips:');
            console.log('  - Click map to add pins');
            console.log('  - Click pins for options (save, weather, delete)');
            console.log('  - Press M for measure tool');
            console.log('  - Press L to locate yourself');
            console.log('  - Press C to clear all markers');
            console.log('  - Press ESC to cancel measurement');

        })();
    </script>
</body>
</html>
