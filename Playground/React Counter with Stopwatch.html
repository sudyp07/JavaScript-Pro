<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⏱️ React Counter + Stopwatch</title>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #dce5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background: radial-gradient(ellipse at center, #1a0a2e, #0a0a1a);
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .app-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(108, 92, 231, 0.03), transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(253, 121, 168, 0.03), transparent 60%),
                radial-gradient(circle at 50% 20%, rgba(0, 206, 201, 0.03), transparent 60%);
            animation: rotate-bg 30s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate-bg {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fd79a8, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #8899c7;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 0.3rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 0.8rem;
            background: transparent;
            color: #8899c7;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            color: #dce5ff;
        }
        .tab-btn.active {
            background: rgba(108, 92, 231, 0.2);
            color: #dce5ff;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.1);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;
            min-height: 300px;
        }

        /* Counter Styles */
        .counter-display {
            text-align: center;
            padding: 1rem 0;
        }
        .counter-number {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fd79a8, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            transition: all 0.3s;
            font-variant-numeric: tabular-nums;
        }
        .counter-number.animate {
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .counter-label {
            color: #8899c7;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .counter-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #dce5ff;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }
        .btn-primary:hover {
            background: #7d6ff0;
        }
        .btn-success {
            background: #00b894;
            border-color: #00b894;
            color: white;
        }
        .btn-success:hover {
            background: #00d2a0;
        }
        .btn-danger {
            background: #e17055;
            border-color: #e17055;
            color: white;
        }
        .btn-danger:hover {
            background: #e74c6f;
        }
        .btn-warning {
            background: #fdcb6e;
            border-color: #fdcb6e;
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #ffeaa7;
        }
        .btn-info {
            background: #6bcbff;
            border-color: #6bcbff;
            color: #1a1a2e;
        }
        .btn-info:hover {
            background: #87d4ff;
        }
        .btn-full {
            grid-column: 1 / -1;
        }

        /* Stopwatch Styles */
        .stopwatch-display {
            text-align: center;
            padding: 1rem 0;
        }
        .stopwatch-time {
            font-size: 5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #00cec9, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
        }
        .stopwatch-time .milliseconds {
            font-size: 3rem;
            color: #8899c7;
            -webkit-text-fill-color: #8899c7;
        }
        .stopwatch-label {
            color: #8899c7;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .stopwatch-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .lap-list {
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1rem;
            padding: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .lap-list::-webkit-scrollbar {
            width: 3px;
        }
        .lap-list::-webkit-scrollbar-thumb {
            background: #3a4f7a;
            border-radius: 10px;
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0.6rem;
            font-size: 0.85rem;
            color: #8899c7;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'Courier New', monospace;
        }
        .lap-item:last-child {
            border-bottom: none;
        }
        .lap-item .lap-number {
            color: #54668f;
        }
        .lap-item .lap-time {
            color: #dce5ff;
        }
        .lap-item .lap-best {
            color: #00b894;
        }
        .lap-empty {
            text-align: center;
            color: #54668f;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        /* Toast notification */
        .toast-popup {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 1.2rem;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            max-width: 400px;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .toast-popup.show {
            transform: translateX(0);
        }
        .toast-popup .toast-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .toast-popup .toast-content {
            flex: 1;
        }
        .toast-popup .toast-content .title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .toast-popup .toast-content .desc {
            font-size: 0.8rem;
            color: #8899c7;
        }
        .toast-popup .toast-close {
            background: none;
            border: none;
            color: #54668f;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 0.2rem;
        }
        .toast-popup .toast-close:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .app-container {
                padding: 1.5rem;
                border-radius: 1.5rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .counter-number {
                font-size: 4rem;
            }
            .stopwatch-time {
                font-size: 3.5rem;
            }
            .stopwatch-time .milliseconds {
                font-size: 2rem;
            }
            .counter-buttons,
            .stopwatch-buttons {
                grid-template-columns: 1fr 1fr;
            }
            .btn-full {
                grid-column: 1 / -1;
            }
            .tabs {
                flex-direction: row;
            }
            .tab-btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.6rem;
            }
            .toast-popup {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                max-width: unset;
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- Toast Popup -->
    <div class="toast-popup" id="toastPopup">
        <span class="toast-icon" id="popupIcon">✅</span>
        <div class="toast-content">
            <div class="title" id="popupTitle">Action Complete</div>
            <div class="desc" id="popupDesc">Your action was successful</div>
        </div>
        <button class="toast-close" id="popupClose">✕</button>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ---------- Toast System ----------
        function showToast(icon, title, desc) {
            const popup = document.getElementById('toastPopup');
            const popupIcon = document.getElementById('popupIcon');
            const popupTitle = document.getElementById('popupTitle');
            const popupDesc = document.getElementById('popupDesc');
            const popupClose = document.getElementById('popupClose');

            popupIcon.textContent = icon;
            popupTitle.textContent = title;
            popupDesc.textContent = desc;
            popup.classList.add('show');

            clearTimeout(popupClose._timer);
            popupClose._timer = setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);

            popupClose.onclick = () => {
                popup.classList.remove('show');
                clearTimeout(popupClose._timer);
            };
        }

        // ---------- Counter Component ----------
        function Counter({ onAction }) {
            const [count, setCount] = useState(0);
            const [animate, setAnimate] = useState(false);

            const updateCount = (newCount) => {
                setCount(newCount);
                setAnimate(true);
                setTimeout(() => setAnimate(false), 300);
                onAction?.('counter', newCount);
            };

            const increment = () => updateCount(count + 1);
            const decrement = () => updateCount(count - 1);
            const reset = () => updateCount(0);
            const incrementBy5 = () => updateCount(count + 5);
            const decrementBy5 = () => updateCount(count - 5);
            const random = () => updateCount(Math.floor(Math.random() * 100) - 50);

            return (
                <div className="counter-display">
                    <div className={`counter-number ${animate ? 'animate' : ''}`}>
                        {count}
                    </div>
                    <div className="counter-label">
                        {count > 0 ? 'Positive 🔥' : count < 0 ? 'Negative ❄️' : 'Neutral ⚖️'}
                    </div>
                    <div className="counter-buttons">
                        <button className="btn btn-success" onClick={increment}>➕ +1</button>
                        <button className="btn btn-danger" onClick={decrement}>➖ -1</button>
                        <button className="btn btn-warning" onClick={reset}>🔄 Reset</button>
                        <button className="btn btn-info" onClick={incrementBy5}>➕ +5</button>
                        <button className="btn btn-info" onClick={decrementBy5}>➖ -5</button>
                        <button className="btn btn-primary" onClick={random}>🎲 Random</button>
                    </div>
                </div>
            );
        }

        // ---------- Stopwatch Component ----------
        function Stopwatch({ onAction }) {
            const [time, setTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [laps, setLaps] = useState([]);
            const [bestLap, setBestLap] = useState(null);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (isRunning) {
                    intervalRef.current = setInterval(() => {
                        setTime(prev => prev + 10);
                    }, 10);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [isRunning]);

            const formatTime = (ms) => {
                const minutes = Math.floor(ms / 60000);
                const seconds = Math.floor((ms % 60000) / 1000);
                const milliseconds = Math.floor((ms % 1000) / 10);
                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
            };

            const start = () => {
                setIsRunning(true);
                onAction?.('stopwatch', 'started');
                showToast('▶️', 'Stopwatch Started', 'Timer is running!');
            };

            const stop = () => {
                setIsRunning(false);
                onAction?.('stopwatch', 'stopped');
                showToast('⏹️', 'Stopwatch Stopped', `Time: ${formatTime(time)}`);
            };

            const reset = () => {
                setIsRunning(false);
                setTime(0);
                setLaps([]);
                setBestLap(null);
                onAction?.('stopwatch', 'reset');
                showToast('🔄', 'Stopwatch Reset', 'Timer cleared');
            };

            const lap = () => {
                if (!isRunning) {
                    showToast('⚠️', 'Start First', 'Start the stopwatch before taking a lap!');
                    return;
                }
                const lapTime = time;
                const lapNumber = laps.length + 1;
                const formattedTime = formatTime(lapTime);
                const isBest = bestLap === null || lapTime < bestLap;

                setLaps(prev => [...prev, { number: lapNumber, time: lapTime, formatted: formattedTime, isBest }]);
                if (isBest) setBestLap(lapTime);

                onAction?.('stopwatch', 'lap', lapNumber, formattedTime);
                showToast('🏁', `Lap ${lapNumber}`, `${formattedTime}${isBest ? ' 🏆 Best!' : ''}`);
            };

            const getLapDisplay = () => {
                if (laps.length === 0) {
                    return <div className="lap-empty">No laps recorded yet. Start the timer and tap "Lap"!</div>;
                }
                return laps.map(lap => (
                    <div className="lap-item" key={lap.number}>
                        <span className="lap-number">Lap #{lap.number}</span>
                        <span className={lap.isBest ? 'lap-time lap-best' : 'lap-time'}>
                            {lap.formatted} {lap.isBest && '🏆'}
                        </span>
                    </div>
                ));
            };

            return (
                <div className="stopwatch-display">
                    <div className="stopwatch-time">
                        {formatTime(time)}
                    </div>
                    <div className="stopwatch-label">
                        {isRunning ? '⏱️ Running...' : '⏸️ Paused'}
                        {laps.length > 0 && ` • ${laps.length} laps`}
                        {bestLap !== null && ` • Best: ${formatTime(bestLap)}`}
                    </div>
                    <div className="stopwatch-buttons">
                        {!isRunning ? (
                            <button className="btn btn-success" onClick={start}>▶️ Start</button>
                        ) : (
                            <button className="btn btn-danger" onClick={stop}>⏹️ Stop</button>
                        )}
                        <button className="btn btn-primary" onClick={lap}>🏁 Lap</button>
                        <button className="btn btn-warning" onClick={reset}>🔄 Reset</button>
                    </div>
                    <div className="lap-list">
                        {getLapDisplay()}
                    </div>
                </div>
            );
        }

        // ---------- Main App Component ----------
        function App() {
            const [activeTab, setActiveTab] = useState('counter');
            const [logs, setLogs] = useState([]);

            const handleAction = useCallback((type, action, ...args) => {
                const log = {
                    type,
                    action,
                    args,
                    time: new Date().toLocaleTimeString()
                };
                setLogs(prev => [log, ...prev].slice(0, 20));
            }, []);

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>⚡ React Counter + Stopwatch</h1>
                        <p>Built with React 18 • Single HTML File</p>
                    </div>

                    <div className="tabs">
                        <button
                        className={`tab-btn ${activeTab === 'counter' ? 'active' : ''}`}
                        onClick={() => setActiveTab('counter')}
                        >
                        🔢 Counter
                    </button>
                    <button
                    className={`tab-btn ${activeTab === 'stopwatch' ? 'active' : ''}`}
                    onClick={() => setActiveTab('stopwatch')}
                    >
                    ⏱️ Stopwatch
                </button>
            </div>

            <div className="content">
                {activeTab === 'counter' ? (
                    <Counter onAction={handleAction} />
                ) : (
                    <Stopwatch onAction={handleAction} />
                )}
            </div>
        </div>
    );
}

// ---------- Render ----------
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

console.log('⚡ React Counter + Stopwatch loaded!');
console.log('💡 Tips:');
console.log('  - Switch between Counter and Stopwatch using the tabs');
console.log('  - Counter: Click buttons or use keyboard shortcuts');
console.log('  - Stopwatch: Start, stop, and record laps');
console.log('  - All actions are logged in the console');
console.log('  - Built with React 18 in a single HTML file!');
</script>

</body>
</html>
